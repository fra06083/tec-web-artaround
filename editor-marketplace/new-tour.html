<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crea Nuova visita - ArtAround</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../css/styles.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="js/new-tour.js"></script>
</head>

<body class="bg-dark text-white font-sans" data-bs-theme="dark" x-data="newTourApp()">

    <div x-show="!isReady">
        <div class="vh-100 d-flex flex-column align-items-center justify-content-center text-center">
            <div class="spinner-border text-orange mb-4" role="status"></div>
            <h3 class="fw-bold">Caricamento Editor...</h3>
        </div>
    </div>

    <div x-show="isReady" x-cloak class="d-flex">

        <aside class="sidebar bg-dark shadow vh-100 sticky-top">
            <div class="p-4 mb-3">
                <a class="navbar-brand fw-bold text-white fs-4 d-flex align-items-center gap-2" href="editor.html">
                    <i class="bi bi-box text-orange"></i> ArtAround
                </a>
            </div>

            <nav class="mt-4">
                <a href="#" class="nav-link-admin active">
                    <i class="bi bi-grid-fill"></i> Dashboard
                </a>
                <a href="tours.html" class="nav-link-admin">
                    <i class="bi bi-pencil-square"></i> Gestione Visite
                </a>
                <a href="#" class="nav-link-admin">
                    <i class="bi bi-people"></i> Gestione Utenti
                </a>
                <a href="#" class="nav-link-admin">
                    <i class="bi bi-bar-chart"></i> Statistiche
                </a>
                <div class="border-top border-secondary my-4 opacity-25"></div>
                <a href="#" @click.prevent="logout()" class="nav-link-admin text-danger">
                    <i class="bi bi-box-arrow-right"></i> Logout
                </a>
            </nav>
        </aside>

        <main class="main-content flex-grow-1">
            <header class="navbar bg-dark border-bottom border-secondary py-3 px-4">
                <h5 class="m-0 fw-bold">Nuova Visita
                </h5>

                <div class="ms-auto">
                    <span class="small text-white-50 me-3">Admin: <strong x-text="username"></strong></span>
                </div>
            </header>

            <div class="p-4 p-lg-5">
                <div class="card bg-secondary bg-opacity-10 border-0 rounded-4 p-4 shadow-sm">
                    <h4 class="fw-bold mb-4">Informazioni Generali</h4>

                    <form @submit.prevent="saveTour()">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-white-50">Nome del Tour</label>
                                <input type="text" class="form-control bg-dark border-secondary text-white"
                                    x-model="tourData.name" placeholder="es. I segreti del Rinascimento">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label small fw-bold text-white-50">Museo</label>
                                <select class="form-select bg-dark border-secondary text-white"
                                    x-model="tour.museum_id">
                                    <option value="">Seleziona un museo...</option>
                                    <template x-for="m in museums" :key="m._id">
                                        <option :value="m._id" x-text="m.museum"></option>
                                    </template>
                                </select>
                            </div>
                            <div class="col-12">
                                <label class="form-label small fw-bold text-white-50">Descrizione</label>
                                <textarea class="form-control bg-dark border-secondary text-white" rows="3"
                                    x-model="tour.description"></textarea>
                            </div>
                        </div>

                        <hr class="my-4 border-secondary opacity-25">

                        <div class="d-flex justify-content-end gap-3">
                            <a href="editor.html" class="btn btn-outline-light rounded-pill px-4">Annulla</a>
                            <button type="submit" class="btn btn-orange rounded-pill px-4 fw-bold">
                                Salva e Aggiungi Opere <i class="bi bi-arrow-right"></i>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </main>
    </div>
</body>

</html>
