<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marketplace - ArtAround</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <link rel="stylesheet" href="../css/styles.css" />

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

</head>

<body class="bg-dark text-white font-sans" data-bs-theme="dark" x-data="marketplaceApp()">

    <nav class="navbar navbar-expand-lg bg-orange-dark sticky-top py-3 shadow" data-bs-theme="dark">
        <div class="container-lg">

            <a class="navbar-brand fw-bold text-white fs-4 m-0 d-flex align-items-center gap-2" href="../index.html">
                <i class="bi bi-box"></i> ArtAround
                <span class="text-white-50 fw-normal fs-6 d-none d-sm-inline">| Marketplace</span>
            </a>

            <button class="navbar-toggler border-0 shadow-none text-white" type="button" data-bs-toggle="collapse"
                data-bs-target="#appNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="appNav">

                <form class="d-flex mx-auto my-3 my-lg-0 w-100 max-w-450" @submit.prevent="searchTours()">
                    <div class="input-group">
                        <span
                            class="input-group-text bg-black bg-opacity-25 border-0 text-white rounded-start-pill ps-3">
                            <i class="bi bi-search"></i>
                        </span>
                        <input type="search"
                            class="form-control border-0 rounded-end-pill shadow-none bg-black bg-opacity-25 text-white search-glass"
                            placeholder="Cerca per museo o città..." aria-label="Search" x-model="searchQuery">
                    </div>
                </form>

                <div class="d-flex align-items-center justify-content-center gap-3 ms-lg-auto mt-3 mt-lg-0">

                    <template x-if="permissions !== 'visitatore' && permissions !== ''">
                        <a href="editor.html" class="btn btn-outline-light rounded-pill px-4 fw-bold btn-with-icon">
                            <i class="bi bi-pencil-square"></i> Area Editor
                        </a>
                    </template>

                    <div class="position-relative d-inline-block" x-data="{ open: false }" x-show="isLoggedIn" x-cloak>
                        <button @click="open = !open" @click.outside="open = false"
                            class="btn bg-white text-orange rounded-pill px-4 py-2 fw-bold shadow-sm btn-with-icon">
                            <i class="bi bi-person-circle"></i>
                            <span x-text="username"></span>
                            <i class="bi bi-chevron-down small ms-1"></i>
                        </button>

                        <div x-show="open" x-transition.opacity
                            class="auth-dropdown-menu shadow-lg border border-secondary rounded-4 py-2 mt-2 position-absolute right-0">
                            <a href="#" @click.prevent="logout()"
                                class="d-flex align-items-center px-4 py-2 text-danger text-decoration-none fw-bold hover-bg-light">
                                <i class="bi bi-box-arrow-right me-2"></i> Esci
                            </a>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </nav>

    <div class="container-lg py-5 mt-3" x-cloak x-show="isReady">

        <div class="row mb-5 align-items-end">
            <div class="col-12 col-md-8">
                <h1 class="display-5 fw-bold mb-2">Esplora i Tour</h1>
                <p class="lead text-white-50 mb-0">Scarica le configurazioni dei musei e personalizza la tua visita.</p>
            </div>
        </div>

        <div class="row g-4">

            <aside class="col-12 col-lg-3">
                <div class="bg-secondary bg-opacity-10 p-4 rounded-4 border border-secondary border-opacity-25 h-100">
                    <h6 class="fw-bold text-uppercase small text-white-50 mb-4">Filtra per Categoria</h6>
                    <div class="d-flex flex-column gap-2">
                        <button class="btn btn-primary text-start fw-medium rounded-3 border-0">Tutti i Musei</button>
                        <button class="btn text-white text-start fw-medium rounded-3 border-0 hover-bg-light">Arte
                            Contemporanea</button>
                        <button class="btn text-white text-start fw-medium rounded-3 border-0 hover-bg-light">Storia e
                            Archeologia</button>
                        <button
                            class="btn text-white text-start fw-medium rounded-3 border-0 hover-bg-light">Scienza</button>
                    </div>
                </div>
            </aside>

            <div class="col-12 col-lg-9">
                <div class="row g-4">

                    <template x-if="isLoading">
                        <div
                            class="col-12 d-flex flex-column align-items-center justify-content-center min-vh-50 text-center">
                            <div class="spinner-border text-primary mb-4 spinner-lg" role="status"></div>
                            <h3 class="fw-bold text-white mb-2">We're curating a great set of art for you...</h3>
                            <p class="text-white-50">Attendi un istante mentre carichiamo il catalogo dei musei.</p>
                        </div>
                    </template>

                    <template x-if="!isLoading && items.length === 0">
                        <div
                            class="col-12 d-flex flex-column align-items-center justify-content-center min-vh-50 text-center bg-secondary bg-opacity-10 rounded-4 border border-secondary border-opacity-25 px-4">
                            <i class="bi bi-palette text-white-50 opacity-25 mb-4 icon-5xl"></i>
                            <h3 class="fw-bold text-white mb-2">Nessun tour trovato</h3>
                            <p class="text-white-50 max-w-450 mb-4">Non siamo riusciti a trovare opere che corrispondano
                                alla tua ricerca. Prova a usare termini diversi.</p>
                            <button class="btn btn-outline-light rounded-pill px-4 fw-bold btn-with-icon"
                                @click="searchQuery = ''">
                                <i class="bi bi-arrow-counterclockwise"></i> Resetta la ricerca
                            </button>
                        </div>
                    </template>

                    <template x-if="!isLoading && items.length > 0">
                        <template x-for="item in items" :key="item.id">
                            <div class="col-12 col-md-6 col-xl-4">
                                <div
                                    class="card h-100 shadow-sm rounded-4 hover-lift overflow-hidden border-secondary border-opacity-25">

                                    <div
                                        class="bg-black bg-opacity-25 w-100 d-flex align-items-center justify-content-center position-relative border-bottom border-secondary border-opacity-25 thumbnail-160">
                                        <i class="bi bi-building text-primary opacity-50 fs-1"></i>
                                    </div>

                                    <div class="card-body p-4 d-flex flex-column bg-secondary bg-opacity-10">
                                        <div class="mb-2">
                                            <span class="badge text-bg-primary rounded-pill px-3 py-2"
                                                x-text="item.category"></span>
                                        </div>
                                        <h5 class="fw-bold mb-2" x-text="item.title"></h5>
                                        <p class="text-white-50 small flex-grow-1" x-text="item.description"></p>

                                        <button
                                            class="btn btn-outline-light w-100 fw-bold rounded-pill btn-with-icon mt-3">
                                            <i class="bi bi-download"></i> Scarica Tour
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </template>

                </div>
            </div>

        </div>
    </div>

</body>

</html>
