<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Marketplace - ArtAround</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <link rel="stylesheet" href="../css/styles.css" />

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="js/index.js"></script>

    <style>
        [x-cloak] {
            display: none !important;
        }
    </style>
</head>

<body class="bg-dark text-white font-sans" data-bs-theme="dark" x-data="marketplaceApp()">

    <nav class="navbar navbar-expand-lg bg-orange-dark sticky-top py-3 shadow" data-bs-theme="dark">
        <div class="container-lg">
            <a class="navbar-brand fw-bold text-white fs-4 m-0 d-flex align-items-center gap-2" href="../index.html">
                <i class="bi bi-box"></i> ArtAround
                <span class="text-white-50 fw-normal fs-6 d-none d-sm-inline">| Marketplace</span>
            </a>

            <button class="navbar-toggler border-0 shadow-none text-white" type="button" data-bs-toggle="collapse"
                data-bs-target="#appNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="appNav">

                <template x-if="isLoggedIn">
                    <form class="d-flex mx-auto my-3 my-lg-0 w-100 max-w-450" @submit.prevent="searchTours()">
                        <div class="input-group">
                            <span
                                class="input-group-text bg-black bg-opacity-25 border-0 text-white rounded-start-pill ps-3">
                                <i class="bi bi-search"></i>
                            </span>
                            <input type="search"
                                class="form-control border-0 rounded-end-pill shadow-none bg-black bg-opacity-25 text-white"
                                placeholder="Cerca per museo o città..." x-model="searchQuery">
                        </div>
                    </form>
                </template>

                <div class="d-flex align-items-center justify-content-center gap-3 ms-lg-auto mt-3 mt-lg-0">

                    <template x-if="!isLoggedIn">
                        <a href="../login.html" class="btn btn-light rounded-pill px-4 fw-bold shadow-sm text-orange">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Sign in
                        </a>
                    </template>

                    <template x-if="isLoggedIn && permissions !== 'visitatore' && permissions !== ''">
                        <a href="editor.html" class="btn btn-outline-light rounded-pill px-4 fw-bold">
                            <i class="bi bi-pencil-square"></i> Area Editor
                        </a>
                    </template>

                    <template x-if="isLoggedIn">
                        <div class="position-relative d-inline-block" x-data="{ open: false }">

                            <button @click="open = !open" @click.outside="open = false"
                                class="btn bg-slate text-white rounded-pill px-4 fw-bold shadow-sm btn-with-icon m-auto">
                                <i class="bi bi-person-circle"></i>
                                <span>Hello, <span x-text="username"></span>!</span>
                                <i class="bi bi-chevron-down small"></i>
                            </button>

                            <div x-show="open" x-transition.opacity x-cloak
                                class="auth-dropdown-menu shadow border-0 rounded-4 py-2 position-absolute bg-white mt-2"
                                style="min-width: 150px; right: 0; z-index: 1050; text-align: left;">

                                <a href="#" @click.prevent="logout()"
                                    class="d-block px-4 py-2 text-danger text-decoration-none fw-bold hover-bg-light">
                                    <i class="bi bi-box-arrow-right me-2"></i> Log out
                                </a>
                            </div>
                        </div>
                    </template>

                </div>
            </div>
        </div>
    </nav>

    <div class="container-lg py-5 mt-3" x-cloak x-show="isReady && isLoggedIn">

        <div class="row mb-5">
            <div class="col-12 col-md-8">
                <h1 class="display-5 fw-bold mb-2">Esplora i Tour</h1>
                <p class="lead text-white-50 mb-0">Scarica le configurazioni dei musei e personalizza la tua visita.</p>
            </div>
        </div>

        <div class="row g-4">
            <aside class="col-12 col-lg-3">
                <div class="bg-secondary bg-opacity-10 p-4 rounded-4 border border-secondary border-opacity-25 h-100">
                    <h6 class="fw-bold text-uppercase small text-white-50 mb-4">Filtra per Categoria</h6>
                    <div class="d-flex flex-column gap-2">
                        <button class="btn btn-primary text-start fw-medium rounded-3 border-0">Tutti i Musei</button>
                        <button class="btn text-white text-start fw-medium rounded-3 border-0">Arte</button>
                        <button class="btn text-white text-start fw-medium rounded-3 border-0">Storia</button>
                        <button class="btn text-white text-start fw-medium rounded-3 border-0">Scienza</button>
                    </div>
                </div>
            </aside>

            <div class="col-12 col-lg-9">
                <div class="row g-4">

                    <template x-if="isLoading">
                        <div class="col-12 text-center py-5">
                            <div class="spinner-border text-primary mb-3" role="status"></div>
                            <p class="text-white-50">Caricamento catalogo in corso...</p>
                        </div>
                    </template>

                    <template x-if="!isLoading && items.length === 0">
                        <div
                            class="col-12 text-center py-5 bg-secondary bg-opacity-10 rounded-4 border border-secondary">
                            <i class="bi bi-palette text-white-50 fs-1 mb-3"></i>
                            <h3 class="fw-bold">Nessun tour trovato</h3>
                            <p class="text-white-50">Prova a cambiare i termini di ricerca.</p>
                        </div>
                    </template>

                    <template x-if="!isLoading && items.length > 0">
                        <template x-for="item in items" :key="item.id">
                            <div class="col-12 col-md-6 col-xl-4">
                                <div
                                    class="card h-100 shadow-sm rounded-4 overflow-hidden border-secondary border-opacity-25 bg-secondary bg-opacity-10">
                                    <div class="card-body p-4 d-flex flex-column">
                                        <div class="mb-2">
                                            <span class="badge text-bg-primary rounded-pill px-3 py-2"
                                                x-text="item.category"></span>
                                        </div>
                                        <h5 class="fw-bold mb-2" x-text="item.title"></h5>
                                        <p class="text-white-50 small flex-grow-1" x-text="item.description"></p>
                                        <button class="btn btn-outline-light w-100 fw-bold rounded-pill mt-3">
                                            <i class="bi bi-download"></i> Scarica Tour
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </template>

                </div>
            </div>
        </div>
    </div>

    <div class="container py-5 text-center" x-show="isReady && !isLoggedIn">
        <i class="bi bi-lock fs-1 text-orange"></i>
        <h2 class="mt-3">Contenuto Riservato</h2>
        <p>Effettua il <a href="../login.html" class="text-orange">Sign in</a> per esplorare i tour del Marketplace.</p>
    </div>

</body>

</html>
