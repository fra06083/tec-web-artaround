<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Museum Marketplace - ArtAround</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/effects.css" />
    <link rel="stylesheet" href="/css/mobile-nav.css?v=2" />
    <link rel="stylesheet" href="/css/toasts.css" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="/js/editor/index.js?v=2"></script>

</head>

<body class="bg-white text-dark font-sans marketplace-light" x-data="marketplaceApp()"
    :class="{ 'marketplace-dark-mode': darkMode }">

    <div x-show="isReady" x-cloak class="d-flex flex-column min-vh-100">

        <!-- NAVBAR DESKTOP & MOBILE -->
        <header class="navbar fixed-top w-100 py-3 desktop-navbar transition-theme shadow-sm border-0" :class="darkMode ? 'glass-header border-bottom border-secondary border-opacity-10' : 'glass-header-light'" x-data="{ mobileSearchOpen: false }">
            <div class="container-lg d-flex flex-wrap align-items-center justify-content-between">
                
                <!-- 1. LOGO -->
                <a class="navbar-brand fw-black fs-4 m-0 d-flex align-items-center gap-2 order-1 me-auto" href="../index.html">
                    <div class="p-2 rounded-3 d-flex align-items-center justify-content-center"
                        :class="darkMode ? 'bg-cream text-teal' : 'bg-teal text-cream'">
                        <i class="bi bi-box-seam fs-5"></i>
                    </div>
                    <div class="d-flex align-items-center">
                        <span :class="darkMode ? 'text-cream' : 'text-teal'" class="ls-minus-1">ArtAround</span>
                        <span class="fs-5 text-secondary fw-medium ms-2 opacity-50">| Marketplace</span>
                    </div>
                </a>

                <!-- 2. MOBILE CONTROLS -->
                <div class="d-flex d-lg-none align-items-center gap-2 order-2">
                    <button class="btn btn-link p-1 shadow-none theme-btn-mobile" :class="darkMode ? 'text-white' : 'text-dark'" @click="darkMode = !darkMode">
                        <i class="bi fs-5" :class="darkMode ? 'bi-moon-stars-fill' : 'bi-sun-fill text-warning'"></i>
                    </button>
                </div>

                <!-- 3. DESKTOP SEARCH BAR -->
                <div class="d-none d-lg-flex align-items-center flex-grow-1 mx-4 nav-search-container order-lg-2">
                    <div class="search-input-wrapper w-100">
                        <i class="bi bi-search search-icon"></i>
                        <input type="text" class="search-input w-100" placeholder="Cerca visite..." x-model="searchQuery">
                    </div>
                    <div class="search-glow"></div>
                </div>

                <!-- 3. DESKTOP THEME TOGGLE -->
                <button class="btn btn-link p-1 shadow-none order-lg-4 ms-2 d-none d-lg-flex" :class="darkMode ? 'text-white' : 'text-dark'" @click="darkMode = !darkMode">
                    <i class="bi fs-5" :class="darkMode ? 'bi-moon-stars-fill' : 'bi-sun-fill text-warning'"></i>
                </button>

                <!-- 4. DESKTOP LINKS -->
                <div class="d-none d-lg-flex align-items-center gap-3 ms-auto order-3 order-lg-3">
                    <a href="../navigator/"
                        class="nav-link fw-bold px-4 py-2 rounded-pill d-flex align-items-center justify-content-center gap-2 nav-hover-premium"
                        :class="darkMode ? 'text-cream' : 'text-darkgrey'">
                        <i class="bi bi-compass fs-5 text-terracotta"></i> Naviga
                    </a>

                    <a href="../editor-marketplace/"
                        class="nav-link fw-bold px-4 py-2 rounded-pill d-flex align-items-center justify-content-center gap-2 nav-hover-premium"
                        :class="darkMode ? 'text-cream' : 'text-darkgrey'">
                        <i class="bi bi-shop fs-5 text-terracotta"></i> Marketplace
                    </a>

                    <div class="vr mx-2" :class="darkMode ? 'bg-cream opacity-25' : 'bg-dark opacity-25'"></div>
                    <!-- Cart moved to Floating Action Button -->
                    <!-- Auth Section -->
                    <template x-if="!isLoggedIn">
                        <a href="../login.html" class="btn rounded-pill px-4 fw-bold shadow-sm btn-reveal-icon"
                            :class="darkMode ? 'bg-teal text-cream' : 'bg-teal text-cream'">
                            <span>Sign in</span>
                            <i class="bi bi-arrow-right-short reveal-icon"></i>
                        </a>
                    </template>

                    <template x-if="isLoggedIn">
                        <div class="position-relative" x-data="{ open: false }">
                            <button @click="open = !open" @click.outside="open = false"
                                class="btn p-0 border-0 d-flex align-items-center gap-2 shadow-none">
                                <div class="user-avatar position-relative rounded-circle bg-orange text-white d-flex align-items-center justify-content-center fw-bold shadow-sm border border-2 border-gold overflow-hidden">
                                    <span x-text="username ? username.charAt(0).toUpperCase() : ''"></span>
                                    <template x-if="propic">
                                        <img :src="propic" alt="" class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover" style="opacity: 0; transition: opacity 0.3s;" onload="this.style.opacity='1'" onerror="this.style.opacity='0'">
                                    </template>
                                </div>
                                <i class="bi bi-chevron-down x-small chevron-icon" :class="darkMode ? 'text-cream' : 'text-teal'"></i>
                            </button>

                            <!-- Dropdown Menu Professionale -->
                            <div x-show="open" x-cloak
                                x-transition:enter="transition ease-out duration-200"
                                x-transition:enter-start="opacity-0 scale-95"
                                x-transition:enter-end="opacity-100 scale-100"
                                x-transition:leave="transition ease-in duration-150"
                                x-transition:leave-start="opacity-100 scale-100"
                                x-transition:leave-end="opacity-0 scale-95"
                                class="auth-dropdown-menu rounded-4 py-2 mt-2 position-absolute end-0"
                                :class="darkMode ? 'bg-dark' : 'bg-white'">
                                <div class="dropdown-header-info px-4 py-2 border-bottom" :class="darkMode ? 'border-secondary border-opacity-25' : 'border-light'">
                                    <div class="fw-bold user-name-text" :class="darkMode ? 'text-white' : 'text-dark'" x-text="username"></div>
                                    <div class="x-small text-uppercase text-orange fw-bold" x-text="permissions"></div>
                                </div>

                                <template x-if="permissions === 'admin' || permissions === 'editor' || permissions === 'docente'">
                                    <a href="/editor/dashboard" class="dropdown-link-item">
                                        <i class="bi bi-grid-1x2 text-orange"></i>
                                        <span>Dashboard Personale</span>
                                    </a>
                                </template>

                                <button @click="openProfileModal(); open = false" class="btn w-100 text-start dropdown-link-item border-0 bg-transparent">
                                    <i class="bi bi-person-circle text-orange"></i>
                                    <span class="fw-bold">Profilo</span>
                                </button>

                                <div class="dropdown-divider-custom"></div>

                                    <button @click="logout()" class="btn btn-danger w-100 fw-bold text-white mt-2 rounded-3 border-0">Logout</button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>

            <!-- 5. MOBILE SEARCH POPUP DROPDOWN -->
            <div x-show="mobileSearchOpen" x-transition.opacity.duration.200ms class="position-absolute top-100 start-0 w-100 p-3 shadow-lg border-bottom d-lg-none mobile-search-dropdown" :class="darkMode ? 'bg-dark border-secondary border-opacity-25' : 'bg-white border-light'" x-cloak>
                <div class="search-input-wrapper w-100">
                    <i class="bi bi-search search-icon"></i>
                    <input type="text" class="search-input w-100" placeholder="Cerca visite..." x-model="searchQuery">
                </div>
            </div>
        </header>

        <!-- MAIN CONTENT -->
        <main class="flex-grow-1 p-3 p-lg-5 pt-5 mt-5">

            <!-- MARKETPLACE HERO & CARDS -->
            <div class="container-lg flex-grow-1 py-2 py-lg-4">

            <!-- HERO SECTION (usa la classe .navigator-hero-gradient animata) -->
            <div class="mb-5 rounded-5 p-4 p-md-5 navigator-hero-gradient overflow-hidden position-relative shadow-lg">
                <div class="row align-items-center position-relative z-1">
                    <div class="col-12 col-md-8 text-center text-md-start">
                        <h1 class="fw-black mb-2 text-white display-5 tracking-tight">Esplora i Pacchetti Tour</h1>
                        <p class="text-white-75 lead mb-4 fw-medium">Acquista i pacchetti per i migliori musei ed esposizioni.</p>

                        <div class="d-flex flex-wrap justify-content-center justify-content-md-start gap-2">
                            <!-- Badge Musei -->
                            <span
                                class="badge bg-white bg-opacity-10 text-white rounded-pill p-2 d-inline-flex align-items-center border border-white border-opacity-10 shadow-sm glass-search-wrapper">
                                <i class="bi bi-building me-2 text-white opacity-75"></i>
                                <span><strong class="fw-bold">500+</strong> Musei</span>
                            </span>

                            <!-- Badge Rating -->
                            <span
                                class="badge bg-white bg-opacity-10 text-white rounded-pill p-2 d-inline-flex align-items-center border border-white border-opacity-10 shadow-sm glass-search-wrapper">
                                <i class="bi bi-star-fill me-2 text-warning"></i>
                                <span><strong class="fw-bold">4.9</strong> Rating</span>
                            </span>
                        </div>
                    </div>
                    <div class="col-md-4 d-none d-md-block text-end">
                        <i class="bi bi-shop text-white opacity-50 hero-icon-animated hero-icon-large"></i>
                    </div>
                </div>
            </div>

            <!-- FILTRI (Gestiti con scroll orizzontale su mobile senza inline style) -->
            <div class="mb-4 overflow-auto">
                <div class="d-flex flex-nowrap flex-lg-wrap gap-2 pb-2">
                    <button @click="toggleTag('Tutti')" 
                            :class="{'active bg-orange text-white border-orange': selectedTags.length === 0}"
                            class="btn filter-pill rounded-pill px-4">Tutti</button>
                    <template x-for="tag in predefinedTags" :key="tag">
                        <button @click="toggleTag(tag)" 
                                :class="{'active bg-orange text-white border-orange': selectedTags.includes(tag)}"
                                class="btn filter-pill rounded-pill px-4" x-text="tag"></button>
                    </template>
                </div>
            </div>

            <!-- GRID DEI TOUR -->
            <div class="row g-4">
                <template x-for="tour in filteredItems" :key="tour._id">
                    <div class="col-12 col-md-6 col-lg-4 col-xl-3">
                        <!-- Usa .card-hover-premium per animazioni ultra -->
                        <div class="card artwork-card h-100 border-0 rounded-4 overflow-hidden d-flex flex-column card-hover-premium shadow-sm">

                            <!-- Immagine (usa .artwork-preview del tuo CSS) -->
                            <div class="artwork-preview position-relative">
                                <div
                                    class="bg-gradient-orange w-100 h-100 d-flex align-items-center justify-content-center text-white">
                                    <i class="bi bi-palette fs-1"></i>
                                </div>
                                <span class="badge bg-white text-orange position-absolute top-0 m-3 shadow-sm">
                                    Tour Guidato
                                </span>
                            </div>

                            <div class="card-body p-4 d-flex flex-column">
                                <h5 class="fw-bold mb-1" x-text="tour.name"></h5>

                                <div class="d-flex align-items-center gap-1 text-secondary small mb-3">
                                    <i class="bi bi-geo-alt-fill text-orange"></i>
                                    <span x-text="tour.museum_id.museum"></span>
                                </div>

                                <p class="text-secondary small flex-grow-1" x-text="tour.description"></p>

                                <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top">
                                    <div class="d-flex flex-column">
                                        <span class="text-orange fw-bold fs-5">€ 12,00</span>
                                        <span class="x-small text-secondary fw-bold"
                                            x-text="tour.items.length + ' opere'"></span>
                                    </div>
                                    
                                    <template x-if="isPurchased(tour._id)">
                                        <button class="btn btn-secondary rounded-pill px-3 fw-bold btn-sm shadow-sm" disabled>
                                            <i class="bi bi-check-circle"></i> Già acquistato
                                        </button>
                                    </template>
                                    <template x-if="!isPurchased(tour._id) && !isInCart(tour._id)">
                                        <button @click="addToCart(tour)" class="btn btn-outline-red rounded-pill px-3 fw-bold btn-sm shadow-sm btn-transition">
                                            Aggiungi
                                        </button>
                                    </template>
                                    <template x-if="!isPurchased(tour._id) && isInCart(tour._id)">
                                        <button @click="var offcanvas = new bootstrap.Offcanvas(document.getElementById('cartOffcanvas')); offcanvas.show();" class="btn bg-orange text-white rounded-pill px-3 fw-bold btn-sm shadow-sm">
                                            Nel carrello
                                        </button>
                                    </template>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </main>

        <!-- FOOTER -->
        <footer class="py-4 mt-auto pb-5 mb-5 pb-lg-4 mb-lg-0" :class="darkMode ? 'bg-dark border-top border-secondary border-opacity-25' : 'bg-light border-top'">
            <div class="container-lg">
                <div class="row align-items-center text-center text-md-start">
                    <div class="col-md-6 small mb-2 mb-md-0" :class="darkMode ? 'text-white-50' : 'text-muted'">
                        &copy; 2026 ArtAround. All rights reserved.
                    </div>
                    <div class="col-md-6 text-md-end fw-bold" :class="darkMode ? 'text-white' : 'text-dark'">
                        <i class="bi bi-box text-orange me-2"></i> ArtAround
                    </div>
                </div>
            </div>
        </footer>

    </div>

    <!-- TOAST NOTIFICATIONS -->
    <div class="toast-container" @show-toast.window="handleToastEvent($event)">
        <template x-for="toast in toasts" :key="toast.id">
            <div class="custom-toast shadow" :class="toast.type === 'success' ? 'toast-success' : (toast.type === 'error' ? 'toast-error' : 'bg-warning text-dark')">
                <i :class="toast.type === 'success' ? 'bi bi-check-circle-fill text-success' : (toast.type === 'error' ? 'bi bi-exclamation-triangle-fill text-danger' : 'bi bi-info-circle-fill')"></i>
                <div class="toast-content">
                    <span class="toast-title" x-text="toast.type === 'success' ? 'Successo' : (toast.type === 'error' ? 'Errore' : 'Avviso')"></span>
                    <span class="toast-msg" x-text="toast.message"></span>
                </div>
            </div>
        </template>
    </div>

    <!-- MOBILE NAVIGATION (Bottom Bar) -->
    <nav class="mobile-nav d-lg-none transition-theme shadow-lg">
        <a href="../navigator/" class="mobile-nav-item">
            <i class="bi bi-compass"></i>
            <span>Naviga</span>
        </a>
        <a href="index.html" class="mobile-nav-item active">
            <i class="bi bi-shop"></i>
            <span>Market</span>
        </a>

        <template x-if="!isLoggedIn">
            <a href="../login.html" class="mobile-nav-item">
                <i class="bi bi-person"></i>
                <span>Accedi</span>
            </a>
        </template>
        <template x-if="isLoggedIn">
            <a href="#mobileProfileOffcanvas" data-bs-toggle="offcanvas" class="mobile-nav-item" @click.prevent="">
                <div class="user-avatar position-relative rounded-circle d-flex align-items-center justify-content-center fw-bold shadow-sm border border-2 border-gold overflow-hidden"
                    :class="darkMode ? 'bg-teal text-cream' : 'bg-cream text-teal'" class="avatar-xs">
                    <span x-text="username ? username.charAt(0).toUpperCase() : ''"></span>
                    <template x-if="propic">
                        <img :src="propic" alt="" class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover" style="opacity: 0; transition: opacity 0.3s;" onload="this.style.opacity='1'" onerror="this.style.opacity='0'">
                    </template>
                </div>
                <span>Profilo</span>
            </a>
        </template>
    </nav>

    <!-- OFFCANVAS PROFILO MOBILE -->
    <div class="offcanvas offcanvas-end border-0 shadow-lg" tabindex="-1" id="mobileProfileOffcanvas" x-init="$el.addEventListener('show.bs.offcanvas', () => $dispatch('profile-opened')); $el.addEventListener('hide.bs.offcanvas', () => $dispatch('profile-closed'));">
        <div class="offcanvas-body d-flex flex-column p-0" :class="darkMode ? 'bg-dark' : 'bg-light'">
            
            <!-- User Banner -->
            <div class="position-relative p-4 p-md-5 text-center shadow-sm" :class="darkMode ? 'bg-gradient-dark-blue' : 'bg-gradient-orange'">
                <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-4" data-bs-dismiss="offcanvas" aria-label="Close"></button>
                <template x-if="isLoggedIn">
                    <div class="mt-3">
                        <div class="user-avatar position-relative auth-hero-avatar rounded-circle bg-white d-flex align-items-center justify-content-center fw-bold shadow mx-auto mb-3 overflow-hidden" :class="darkMode ? 'text-dark' : 'text-orange'">
                            <span x-text="username ? username.charAt(0).toUpperCase() : ''"></span>
                            <template x-if="propic">
                                <img :src="propic" alt="" class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover" style="opacity: 0; transition: opacity 0.3s;" onload="this.style.opacity='1'" onerror="this.style.opacity='0'">
                            </template>
                        </div>
                        <h4 class="fw-bold mb-1 text-white" x-text="username"></h4>
                        <span class="badge bg-white bg-opacity-25 border border-white border-opacity-25 text-white mt-1 text-uppercase px-3 py-2 rounded-pill shadow-sm" x-text="permissions"></span>
                    </div>
                </template>
            </div>
            
            <!-- Menu Links -->
            <div class="p-4 d-flex flex-column gap-3 flex-grow-1">
                <template x-if="permissions === 'admin' || permissions === 'editor' || permissions === 'docente'">
                    <a href="/editor/dashboard" class="btn d-flex align-items-center gap-3 py-3 px-3 rounded-4 fw-bold shadow-sm hover-lift" :class="darkMode ? 'bg-secondary bg-opacity-25 text-white border-0' : 'bg-white text-dark border-0'">
                        <i class="bi bi-grid-1x2-fill fs-5 text-orange"></i>
                        <span>Dashboard Personale</span>
                        <i class="bi bi-chevron-right ms-auto text-muted opacity-50"></i>
                    </a>
                </template>
                
                <button @click="openProfileModal()" data-bs-dismiss="offcanvas" class="btn d-flex align-items-center gap-3 py-3 px-3 rounded-4 fw-bold shadow-sm hover-lift" :class="darkMode ? 'bg-secondary bg-opacity-25 text-white border-0' : 'bg-white text-dark border-0'">
                    <i class="bi bi-person-circle fs-5 text-primary"></i>
                    <span>Profilo</span>
                    <i class="bi bi-chevron-right ms-auto text-muted opacity-50"></i>
                </button>
                
                <div class="mt-auto pt-4">
                                        <button @click="logout()" class="btn btn-danger w-100 fw-bold text-white py-3 rounded-pill border-0 shadow-sm" data-bs-dismiss="offcanvas">Logout</button>
                </div>
            </div>
        </div>
    </div>

    <!-- OFFCANVAS CARRELLO -->
    <div class="offcanvas offcanvas-end border-0 shadow-lg" tabindex="-1" id="cartOffcanvas"
         x-init="$el.addEventListener('show.bs.offcanvas', () => $dispatch('cart-opened')); $el.addEventListener('hide.bs.offcanvas', () => $dispatch('cart-closed'));">
        <div class="offcanvas-body d-flex flex-column p-0" :class="darkMode ? 'bg-dark' : 'bg-light'">
            
            <!-- Cart Header -->
            <div class="p-4 border-bottom shadow-sm d-flex align-items-center justify-content-between" :class="darkMode ? 'bg-dark border-secondary border-opacity-25' : 'bg-white'">
                <h5 class="fw-bold mb-0 d-flex align-items-center gap-2" :class="darkMode ? 'text-white' : 'text-dark'">
                    <i class="bi bi-cart3 text-orange fs-4"></i> Il tuo Carrello
                </h5>
                <button type="button" class="btn-close" :class="darkMode ? 'btn-close-white' : ''" data-bs-dismiss="offcanvas" aria-label="Close"></button>
            </div>
            
            <!-- Cart Body -->
            <div class="p-4 flex-grow-1 overflow-auto">
                <template x-if="cartCount === 0">
                    <div class="text-center py-5">
                        <i class="bi bi-cart-x text-muted opacity-50 empty-state-icon"></i>
                        <p class="mt-3 fw-medium" :class="darkMode ? 'text-white-50' : 'text-muted'">I tuoi prodotti verranno visualizzati qui.</p>
                        <button class="btn bg-orange text-white rounded-pill px-4 fw-bold shadow-sm mt-2" data-bs-dismiss="offcanvas">Esplora il Marketplace</button>
                    </div>
                </template>
                
                <template x-if="cartCount > 0">
                    <div class="d-flex flex-column gap-3">
                        <template x-for="item in cart" :key="item._id">
                            <div class="card border-0 shadow-sm rounded-4 overflow-hidden" :class="darkMode ? 'bg-secondary bg-opacity-10' : 'bg-white'">
                                <div class="row g-0 align-items-center p-2">
                                    <div class="col-3">
                                        <div class="rounded-3 bg-secondary bg-opacity-25 d-flex align-items-center justify-content-center text-orange cart-item-img-placeholder">
                                            <i class="bi bi-ticket-perforated fs-4"></i>
                                        </div>
                                    </div>
                                    <div class="col-7 ps-3">
                                        <h6 class="fw-bold mb-1 text-truncate" :class="darkMode ? 'text-white' : 'text-dark'" x-text="item.name"></h6>
                                        <p class="small mb-0 fw-bold" :class="darkMode ? 'text-white-50' : 'text-muted'">Gratuito</p>
                                    </div>
                                    <div class="col-2 text-end pe-2">
                                        <button @click="removeFromCart(item._id)" class="btn btn-link text-danger p-1 shadow-none">
                                            <i class="bi bi-trash-fill"></i>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </template>
                    </div>
                </template>
            </div>
            
            <!-- Cart Footer -->
            <template x-if="cartCount > 0">
                <div class="p-4 border-top shadow-lg mt-auto" :class="darkMode ? 'bg-dark border-secondary border-opacity-25' : 'bg-white'">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="text-muted fw-bold">Totale:</span>
                        <h4 class="fw-black text-orange mb-0">€ 0.00</h4>
                    </div>
                    <button @click="checkout()" class="btn bg-orange text-white w-100 py-3 rounded-4 fw-bold shadow-sm hover-lift d-flex align-items-center justify-content-center gap-2" data-bs-dismiss="offcanvas">
                        <span>Procedi all'acquisto</span>
                        <i class="bi bi-arrow-right"></i>
                    </button>
                </div>
            </template>
        </div>
    </div>

    <!-- Offcanvas Mobile Profile -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="mobileProfileOffcanvas">
        <div class="offcanvas-header">
            <h5 class="offcanvas-title">Profilo</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <button @click="openProfileModal()" data-bs-dismiss="offcanvas" class="btn btn-outline-orange w-100 mb-3">Modifica Profilo</button>
            <button @click="logout()" class="btn btn-danger w-100">Esci</button>
        </div>
    </div>

    <!-- Modale Profilo Utente -->
    <div class="modal fade profile-modal-backdrop" tabindex="-1" :class="{ 'show d-block': isProfileModalOpen }" x-show="isProfileModalOpen" x-transition>
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content" :class="darkMode ? 'bg-dark text-white' : 'bg-white'">
                <div class="modal-header border-0">
                    <h5 class="modal-title fw-bold">Modifica Profilo</h5>
                    <button type="button" class="btn-close" @click="isProfileModalOpen = false" :class="darkMode ? 'btn-close-white' : ''"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3 text-center">
                        <div class="mx-auto position-relative rounded-circle bg-secondary overflow-hidden mb-3 profile-modal-avatar d-flex align-items-center justify-content-center text-white display-5 fw-bold">
                            <span x-text="profileForm.name ? profileForm.name.charAt(0).toUpperCase() : (username ? username.charAt(0).toUpperCase() : 'U')"></span>
                            <template x-if="profileForm.propic">
                                <img :src="profileForm.propic" class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover" style="opacity: 0; transition: opacity 0.3s;" onload="this.style.opacity='1'" onerror="this.style.opacity='0'">
                            </template>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Nome Visualizzato</label>
                        <input type="text" class="form-control" x-model="profileForm.name">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">URL Immagine Profilo</label>
                        <div class="input-group">
                            <input type="text" class="form-control" x-model="profileForm.propic" placeholder="https://... o data:image/...">
                            <label class="btn btn-outline-secondary mb-0">
                                <i class="bi bi-upload"></i> Carica
                                <input type="file" class="d-none" accept="image/*" @change="uploadProfileImage">
                            </label>
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-0">
                    <button type="button" class="btn btn-secondary" @click="isProfileModalOpen = false">Annulla</button>
                    <button type="button" class="btn bg-orange text-white" @click="updateProfile()">Salva</button>
                </div>
            </div>
        </div>
    </div>
    <!-- CART FLOATING ACTION BUTTON (FAB) -->
    <button class="cart-fab"
        x-show="!isCartOpen"
        @cart-opened.window="isCartOpen = true"
        @cart-closed.window="isCartOpen = false"
        @click="if(isLoggedIn) { var offcanvas = new bootstrap.Offcanvas(document.getElementById('cartOffcanvas')); offcanvas.show(); } else { showToast('Devi essere loggato per poter acquistare! Vai su Sign in', 'error'); }">
        <i class="bi bi-cart3 fs-3"></i>
        <span class="badge bg-danger rounded-pill"
            x-show="cartCount > 0" x-text="cartCount" x-cloak></span>
    </button>

</body>

</html>
