<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Museum Marketplace - ArtAround</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/effects.css" />
    <link rel="stylesheet" href="/css/mobile-nav.css?v=2" />
    <link rel="stylesheet" href="/css/toasts.css" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/@alpinejs/collapse@3.x.x/dist/cdn.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="/js/editor/index.js?v=2"></script>

</head>

<body class="bg-white text-dark font-sans marketplace-light" x-data="marketplaceApp()"
    :class="{ 'dark-mode': darkMode }">

    <div x-show="isReady" x-cloak class="d-flex flex-column min-vh-100">

        <!-- NAVBAR DESKTOP & MOBILE -->
        <header class="navbar fixed-top w-100 py-3 desktop-navbar transition-theme shadow-sm border-0" :class="darkMode ? 'glass-header border-bottom border-secondary border-opacity-10' : 'glass-header-light'" x-data="{ mobileSearchOpen: false }">
            <div class="container-lg d-flex flex-wrap flex-lg-nowrap align-items-center justify-content-between">
                
                <!-- 1. LOGO -->
                <a class="navbar-brand fw-black fs-4 m-0 d-flex align-items-center gap-2 order-1 me-auto" href="../index.html">
                    <div class="p-2 rounded-3 d-flex align-items-center justify-content-center"
                        :class="darkMode ? 'bg-cream text-teal' : 'bg-teal text-cream'">
                        <i class="bi bi-box-seam fs-5"></i>
                    </div>
                    <div class="d-flex align-items-center">
                        <span :class="darkMode ? 'text-cream' : 'text-teal'" class="ls-minus-1">ArtAround</span>
                        <span class="fs-5 text-secondary fw-medium ms-2 opacity-50 d-none d-sm-inline">| Marketplace</span>
                    </div>
                </a>

                <!-- 2. MOBILE CONTROLS -->
                <div class="d-flex d-lg-none align-items-center gap-2 order-2">
                    <button type="button" class="btn btn-link p-1 shadow-none" :class="darkMode ? 'text-white' : 'text-dark'" @click="mobileSearchOpen = !mobileSearchOpen">
                        <i class="bi bi-search fs-5"></i>
                    </button>
                    <button class="btn btn-link p-1 shadow-none theme-btn-mobile" :class="darkMode ? 'text-white' : 'text-dark'" @click="darkMode = !darkMode">
                        <i class="bi fs-5" :class="darkMode ? 'bi-moon-stars-fill' : 'bi-sun-fill text-warning'"></i>
                    </button>
                </div>


                <!-- 3. DESKTOP SEARCH BAR -->
                <div class="d-none d-lg-flex align-items-center flex-grow-1 mx-4 nav-search-container order-lg-2">
                    <div class="search-input-wrapper w-100">
                        <i class="bi bi-search search-icon"></i>
                        <input type="text" class="search-input w-100" placeholder="Cerca visite..." x-model="searchQuery">
                    </div>
                    <div class="search-glow"></div>
                </div>

                <!-- 3. DESKTOP THEME TOGGLE -->
                <button class="btn btn-link p-1 shadow-none order-lg-4 ms-2 d-none d-lg-flex" :class="darkMode ? 'text-white' : 'text-dark'" @click="darkMode = !darkMode">
                    <i class="bi fs-5" :class="darkMode ? 'bi-moon-stars-fill' : 'bi-sun-fill text-warning'"></i>
                </button>

                <!-- 4. DESKTOP LINKS -->
                <div class="d-none d-lg-flex align-items-center gap-3 ms-auto order-3 order-lg-3">
                    <a href="../navigator/"
                        class="nav-link fw-bold px-4 py-2 rounded-pill d-flex align-items-center justify-content-center gap-2 nav-hover-premium"
                        :class="darkMode ? 'text-cream' : 'text-darkgrey'">
                        <i class="bi bi-compass fs-5 text-terracotta"></i> Naviga
                    </a>

                    <a href="../editor-marketplace/"
                        class="nav-link fw-bold px-4 py-2 rounded-pill d-flex align-items-center justify-content-center gap-2 nav-hover-premium"
                        :class="darkMode ? 'text-cream' : 'text-darkgrey'">
                        <i class="bi bi-shop fs-5 text-terracotta"></i> Marketplace
                    </a>

                    <div class="vr mx-2" :class="darkMode ? 'bg-cream opacity-25' : 'bg-dark opacity-25'"></div>
                    <!-- Cart moved to Floating Action Button -->
                    <!-- Auth Section -->
                    <template x-if="!isLoggedIn">
                        <a href="../login.html" class="btn rounded-pill px-4 fw-bold shadow-sm btn-reveal-icon"
                            :class="darkMode ? 'bg-teal text-cream' : 'bg-teal text-cream'">
                            <span>Sign in</span>
                            <i class="bi bi-arrow-right-short reveal-icon"></i>
                        </a>
                    </template>

                    <template x-if="isLoggedIn">
                        <div class="position-relative" x-data="{ open: false }">
                            <button @click="open = !open" @click.outside="open = false"
                                class="btn p-0 border-0 d-flex align-items-center gap-2 shadow-none">
                                <div class="user-avatar position-relative rounded-circle bg-orange text-white d-flex align-items-center justify-content-center fw-bold shadow-sm border border-2 border-gold overflow-hidden">
                                    <span x-text="username ? username.charAt(0).toUpperCase() : ''"></span>
                                    <template x-if="propic">
                                        <img :src="propic" alt="" class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover" style="opacity: 0; transition: opacity 0.3s;" onload="this.style.opacity='1'" onerror="this.style.opacity='0'">
                                    </template>
                                </div>
                                <i class="bi bi-chevron-down x-small chevron-icon" :class="darkMode ? 'text-cream' : 'text-teal'"></i>
                            </button>

                            <!-- Dropdown Menu Professionale -->
                            <div x-show="open" x-cloak
                                x-transition:enter="transition ease-out duration-200"
                                x-transition:enter-start="opacity-0 scale-95"
                                x-transition:enter-end="opacity-100 scale-100"
                                x-transition:leave="transition ease-in duration-150"
                                x-transition:leave-start="opacity-100 scale-100"
                                x-transition:leave-end="opacity-0 scale-95"
                                class="auth-dropdown-menu rounded-4 py-2 mt-2 position-absolute end-0 text-start"
                                :class="darkMode ? 'bg-dark' : 'bg-white'">
                                <div class="dropdown-header-info mb-2">
                                    <div class="d-flex align-items-center justify-content-between gap-2">
                                        <span class="fw-black fs-6 text-truncate" style="max-width: 140px;" x-text="username"></span>
                                        <span class="badge bg-orange text-white text-uppercase px-2 py-1 fs-065 rounded-pill" x-text="permissions"></span>
                                    </div>
                                    <div class="d-flex align-items-center gap-1 mt-1 text-orange small fw-bold">
                                        <i class="bi bi-sliders"></i>
                                        <span class="text-capitalize" x-text="localStorage.getItem('artaround_preferred_level') || 'medio'"></span>
                                    </div>
                                </div>

                                <template x-if="permissions === 'admin' || permissions === 'editor' || permissions === 'docente'">
                                    <a href="/editor/dashboard" class="dropdown-link-item">
                                        <i class="bi bi-grid-1x2 text-orange"></i>
                                        <span>Dashboard Personale</span>
                                    </a>
                                </template>

                                <a href="#" @click.prevent="openProfileModal(); open = false" class="dropdown-link-item cursor-pointer">
                                    <i class="bi bi-person-circle text-primary"></i>
                                    <span>Profilo</span>
                                </a>


                                <div class="dropdown-divider-custom my-1"></div>

                                <button @click="logout()" class="btn btn-outline-danger w-100 fw-bold rounded-3 py-2 border-0 d-flex align-items-center justify-content-center gap-2 mt-1">
                                    <i class="bi bi-box-arrow-right"></i> Logout
                                </button>
                            </div>

                        </div>
                    </template>
                </div>
            </div>

            <!-- 5. MOBILE SEARCH POPUP DROPDOWN -->
            <div x-show="mobileSearchOpen" x-transition.opacity.duration.200ms class="position-absolute top-100 start-0 w-100 p-3 shadow-lg border-bottom d-lg-none mobile-search-dropdown" :class="darkMode ? 'bg-dark border-secondary border-opacity-25' : 'bg-white border-light'" x-cloak>
                <div class="search-input-wrapper w-100">
                    <i class="bi bi-search search-icon"></i>
                    <input type="text" class="search-input w-100" placeholder="Cerca visite..." x-model="searchQuery">
                </div>
            </div>
        </header>

        <!-- MAIN CONTENT -->

    <main class="flex-grow-1 p-3 p-lg-5 pt-5 mt-5" :class="darkMode ? 'bg-secondary bg-opacity-10' : 'bg-light'">
        <div class="container-lg flex-grow-1 py-2 py-lg-4">

            <!-- ============================================================
                SCHERMATA 1 — SCELTA DEL MUSEO
                ============================================================ -->
            <template x-if="!selectedMuseumId">
                <div>

                    <div class="mb-5 rounded-5 p-4 p-md-5 navigator-hero-gradient overflow-hidden position-relative shadow-lg">
                        <div class="row align-items-center position-relative z-1">
                            <div class="col-12 col-md-8 text-center text-md-start">
                                <h1 class="fw-black mb-2 text-white display-5 tracking-tight">Scegli un museo</h1>
                                <p class="text-white-75 lead mb-0 fw-medium">
                                    Seleziona la sede da esplorare: vedrai i suoi tour e la mappa delle sale.
                                </p>
                            </div>
                            <div class="col-md-4 d-none d-md-block text-end">
                                <i class="bi bi-buildings text-white opacity-50 hero-icon-animated hero-icon-large"></i>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between mb-4 gap-3">
                        <div class="d-flex align-items-center flex-grow-1">
                            <h4 class="fw-black mb-0 d-flex align-items-center gap-2 text-nowrap"
                                :class="darkMode ? 'text-white' : 'text-dark'">
                                <i class="bi bi-geo-alt-fill text-orange"></i> Musei disponibili
                            </h4>
                            <div class="ms-3 flex-grow-1 border-bottom"
                                :class="darkMode ? 'border-secondary border-opacity-50' : 'border-secondary border-opacity-25'"></div>
                        </div>
                        <div class="position-relative">
                            <label for="museumSearch" class="visually-hidden">Cerca un museo</label>
                            <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-secondary small"></i>
                            <input type="text" id="museumSearch"
                                class="form-control rounded-pill border-secondary border-opacity-25 shadow-sm ps-5"
                                placeholder="Cerca per nome o provincia..." x-model="museumSearchQuery">
                        </div>
                    </div>

                    <div class="row g-4">
                        <template x-for="m in filteredMuseums" :key="m._id">
                            <div class="col-12 col-md-6 col-lg-4">
                                <button type="button" @click="selectMuseum(m._id)"
                                        class="btn text-start p-0 border-0 w-100 h-100 rounded-4 overflow-hidden shadow-sm hover-lift"
                                        :class="darkMode ? 'bg-dark-grey' : 'bg-white'">
                                    <div class="position-relative bg-dark h-120 overflow-hidden">
                                        <template x-if="m.image">
                                            <img :src="m.image" :alt="'Foto di ' + m.museum"
                                                class="w-100 h-100 object-fit-cover">
                                        </template>
                                        <template x-if="!m.image">
                                            <div class="bg-gradient-orange w-100 h-100 d-flex align-items-center justify-content-center text-white">
                                                <i class="bi bi-bank fs-1"></i>
                                            </div>
                                        </template>
                                        <div class="position-absolute top-0 start-0 w-100 h-100 ticket-vignette"></div>
                                    </div>
                                    <div class="p-4">
                                        <h5 class="fw-black mb-1" :class="darkMode ? 'text-white' : 'text-dark'"
                                            x-text="m.museum"></h5>
                                        <p class="small mb-2" :class="darkMode ? 'text-white-50' : 'text-secondary'" x-text="m.province || ''"></p>

                                        <p class="small mb-3 break-word" x-show="m.description"
                                            :class="darkMode ? 'text-white-50' : 'text-secondary'"
                                            x-text="m.description && m.description.length > 120 ? m.description.substring(0, 120) + '...' : m.description"></p>
                                        <span class="badge bg-orange-subtle text-orange border border-orange border-opacity-25 rounded-pill px-3 py-2"
                                            x-text="tourCountFor(m._id) + (tourCountFor(m._id) === 1 ? ' tour' : ' tour')"></span>
                                    </div>
                                </button>
                            </div>
                        </template>

                        <template x-if="filteredMuseums.length === 0 && !isLoading">
                            <div class="col-12 text-center py-5">
                                <div class="w-h-80 rounded-circle bg-secondary bg-opacity-10 d-inline-flex align-items-center justify-content-center mb-4 mx-auto">
                                    <i class="bi bi-bank text-orange fs-1"></i>
                                </div>
                                <h4 class="fw-bold" :class="darkMode ? 'text-white' : 'text-dark'">Nessun museo trovato</h4>
                                <p :class="darkMode ? 'text-white-50' : 'text-muted'">
                                    Prova a cambiare il testo cercato.
                                </p>
                            </div>
                        </template>
                    </div>

                </div>
            </template>


            <!-- ============================================================
                SCHERMATA 2 — PAGINA DEL MUSEO (visite + mappa)
                ============================================================ -->
            <template x-if="selectedMuseumId && selectedMuseum">
                <div>

                    <!-- Floating Glass Back Button -->
                    <button type="button" @click="clearMuseum()"
                            class="btn glass-card border border-secondary border-opacity-25 rounded-pill px-3.5 py-2 mb-4 d-inline-flex align-items-center gap-2 text-white-50 hover-text-white transition-all shadow-sm active-scale">
                        <i class="bi bi-arrow-left fs-6"></i> <span>Tutti i musei</span>
                    </button>

                    <!-- Hero Banner -->
                    <div class="mb-5 rounded-5 p-4 p-md-5 navigator-hero-gradient overflow-hidden position-relative shadow-xl border border-white border-opacity-10">
                        <div class="row align-items-center position-relative z-1 g-4">
                            <div class="col-12 col-md-8 text-center text-md-start">
                                <h1 class="fw-black mb-3 text-white display-5 tracking-tight lh-sm" x-text="selectedMuseum.museum"></h1>
                                <div class="d-inline-flex align-items-center gap-2" x-show="selectedMuseum.province || selectedMuseum.city">
                                    <span class="rounded-pill px-3 py-1.5 fs-7 d-inline-flex align-items-center gap-1.5 shadow-sm fw-medium badge-glass-hero">
                                        <i class="bi bi-geo-alt-fill text-orange"></i>
                                        <span x-text="(selectedMuseum.city ? selectedMuseum.city + ' ' : '') + (selectedMuseum.province ? '(' + selectedMuseum.province + ')' : '')"></span>
                                    </span>
                                </div>

                            </div>
                            <div class="col-md-4 d-none d-md-flex align-items-center justify-content-end">
                                <template x-if="selectedMuseum && selectedMuseum.image">
                                    <div class="rounded-circle overflow-hidden border border-2 border-white border-opacity-30 shadow-lg icon-box-110">
                                        <img :src="selectedMuseum.image" alt="Logo Museo" class="w-100 h-100 object-fit-cover">
                                    </div>
                                </template>
                                <template x-if="!selectedMuseum || !selectedMuseum.image">
                                    <div class="rounded-circle bg-white bg-opacity-10 border border-white border-opacity-20 p-4 d-flex align-items-center justify-content-center shadow-lg icon-box-110">
                                        <i class="bi bi-bank text-white fs-1 opacity-90"></i>
                                    </div>
                                </template>
                            </div>

                        </div>
                    </div>

                    <!-- Tab Visite / Mappa -->
                    <div class="d-flex align-items-center gap-3 mb-4">
                        <button type="button" class="btn rounded-pill px-4 py-2.5 fw-bold d-inline-flex align-items-center gap-2 transition-all shadow-sm"
                                :class="museumView === 'visite' ? 'bg-orange text-white border-orange shadow-lg' : 'glass-card text-white-50 border border-secondary border-opacity-25 hover-text-white'"
                                @click="museumView = 'visite'">
                            <i class="bi bi-ticket-perforated fs-6"></i> <span>Visite</span>
                        </button>
                        <button type="button" class="btn rounded-pill px-4 py-2.5 fw-bold d-inline-flex align-items-center gap-2 transition-all shadow-sm"
                                :class="museumView === 'mappa' ? 'bg-orange text-white border-orange shadow-lg' : 'glass-card text-white-50 border border-secondary border-opacity-25 hover-text-white'"
                                @click="museumView = 'mappa'">
                            <i class="bi bi-map fs-6"></i> <span>Mappa</span>
                        </button>
                    </div>





                    <!-- ---------- TAB VISITE ---------- -->
                    <div x-show="museumView === 'visite'">

                        <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-between mb-4 gap-3">
                            <div class="d-flex align-items-center flex-grow-1">
                                <h4 class="fw-black mb-0 d-flex align-items-center gap-2 text-nowrap"
                                    :class="darkMode ? 'text-white' : 'text-dark'">
                                    <i class="bi bi-stars text-orange"></i> Tour disponibili
                                </h4>
                                <div class="ms-3 flex-grow-1 border-bottom"
                                    :class="darkMode ? 'border-secondary border-opacity-50' : 'border-secondary border-opacity-25'"></div>
                            </div>

                            <!-- FILTRI DESKTOP (pills) — invariati -->
                            <div class="d-none d-md-block overflow-x-auto hide-scrollbar ms-md-4 mw-100">
                                <div class="d-flex flex-nowrap gap-2 pb-1 pe-1 align-items-center">
                                    <div class="position-relative me-2">
                                        <label for="tagSearch" class="visually-hidden">Cerca categoria</label>
                                        <i class="bi bi-search position-absolute top-50 start-0 translate-middle-y ms-3 text-secondary small"></i>
                                        <input type="text" id="tagSearch"
                                            class="form-control rounded-pill border-secondary border-opacity-25 shadow-sm ps-5 w-auto"
                                            placeholder="Cerca categoria..." x-model="tagSearchQuery">
                                    </div>
                                    <button @click="toggleTag('Tutti')"
                                            :class="{'active bg-orange text-white border-orange': selectedTags.length === 0}"
                                            class="btn filter-pill rounded-pill px-4 text-nowrap shadow-sm">Tutte</button>
                                    <template x-for="tag in filteredAvailableTags" :key="tag">
                                        <button @click="toggleTag(tag)"
                                                :class="{'active bg-orange text-white border-orange': selectedTags.includes(tag)}"
                                                class="btn filter-pill rounded-pill px-4 text-nowrap shadow-sm" x-text="tag"></button>
                                    </template>
                                    <span x-show="filteredAvailableTags.length === 0"
                                        class="text-secondary small ms-2 text-nowrap">Nessuna categoria trovata</span>
                                </div>
                            </div>

                            <!-- FILTRI MOBILE (dropdown) — invariati -->
                            <div class="d-md-none w-100 mt-2">
                                <div class="dropdown w-100">
                                    <button class="btn btn-outline-secondary w-100 rounded-pill px-4 py-2 dropdown-toggle fw-bold d-flex align-items-center justify-content-between text-start shadow-sm border border-secondary border-opacity-25"
                                            type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside"
                                            aria-expanded="false" :class="darkMode ? 'text-white bg-dark' : 'text-dark bg-white'">
                                        <span class="d-flex align-items-center gap-2">
                                            <i class="bi bi-funnel text-orange"></i>
                                            <span x-text="selectedTags.length === 0 ? 'Filtra categorie (Tutte)' : 'Filtra: ' + selectedTags.length + ' selezionate'"></span>
                                        </span>
                                    </button>
                                    <ul class="dropdown-menu w-100 shadow-lg border-0 mt-2 rounded-4 p-2"
                                        :class="darkMode ? 'dropdown-menu-dark bg-dark' : 'bg-white'">
                                        <li class="px-2 mb-2">
                                            <input type="text" class="form-control rounded-pill border-secondary border-opacity-25"
                                                placeholder="Cerca categoria..." x-model="tagSearchQuery" @click.stop>
                                        </li>
                                        <li>
                                            <button class="dropdown-item d-flex align-items-center justify-content-between py-2 rounded-3"
                                                    @click="toggleTag('Tutti')">
                                                <span class="fw-bold">Tutte le categorie</span>
                                                <i class="bi bi-check-circle-fill text-orange fs-5" x-show="selectedTags.length === 0"></i>
                                                <i class="bi bi-circle text-secondary fs-5" x-show="selectedTags.length > 0"></i>
                                            </button>
                                        </li>
                                        <li><hr class="dropdown-divider mx-2"></li>
                                        <template x-for="tag in filteredAvailableTags" :key="tag">
                                            <li>
                                                <button class="dropdown-item d-flex align-items-center justify-content-between py-2 rounded-3"
                                                        @click="toggleTag(tag)">
                                                    <span x-text="tag"></span>
                                                    <i class="bi bi-check-circle-fill text-orange fs-5" x-show="selectedTags.includes(tag)"></i>
                                                    <i class="bi bi-circle text-secondary fs-5" x-show="!selectedTags.includes(tag)"></i>
                                                </button>
                                            </li>
                                        </template>
                                        <li x-show="filteredAvailableTags.length === 0" class="text-center py-2 text-secondary small">
                                            Nessuna categoria trovata
                                        </li>
                                    </ul>
                                </div>
                            </div>
                        </div>

                        <!-- GRID DEI TOUR — card invariate, tolto solo il nome museo -->
                        <div class="row g-4">
                            <template x-if="filteredItems.length === 0 && !isLoading">
                                <div class="col-12 text-center py-5 mt-5">
                                    <div class="w-h-80 rounded-circle bg-secondary bg-opacity-10 d-inline-flex align-items-center justify-content-center mb-4 mx-auto">
                                        <i class="bi bi-compass text-orange fs-1"></i>
                                    </div>
                                    <h4 class="fw-bold" :class="darkMode ? 'text-white' : 'text-dark'">Nessuna visita disponibile</h4>
                                    <p :class="darkMode ? 'text-white-50' : 'text-muted'">
                                        Per questo museo non ci sono visite che corrispondono ai criteri.
                                    </p>
                                    <button x-show="selectedTags.length > 0 || searchQuery !== ''"
                                            @click="selectedTags = []; searchQuery = ''"
                                            class="btn btn-outline-orange rounded-pill px-4 mt-2 fw-bold">Azzera filtri</button>
                                </div>
                            </template>

                            <template x-for="tour in displayedItems" :key="tour._id">
                                <div class="col-12 col-md-6 col-lg-4 col-xl-3">
                                    <div class="card ticket-card h-100 border-0 bg-transparent">
                                        <div class="ticket-body h-100 d-flex flex-column">

                                            <div class="ticket-top position-relative overflow-hidden bg-dark">
                                                <template x-if="tour.image">
                                                    <img :src="tour.image" alt="" class="w-100 h-100 object-fit-cover">
                                                </template>
                                                <template x-if="!tour.image && tour.museum_id && tour.museum_id.image">
                                                    <img :src="tour.museum_id.image" alt="" class="w-100 h-100 object-fit-cover">
                                                </template>
                                                <template x-if="!tour.image && (!tour.museum_id || !tour.museum_id.image)">
                                                    <div class="bg-gradient-orange w-100 h-100 d-flex align-items-center justify-content-center text-white">
                                                        <i class="bi bi-image fs-1"></i>
                                                    </div>
                                                </template>

                                                <template x-if="o.s.tipo === 'sala'">

                                        </div>
                                    </template>

                                </div>
                            </div>
                        </div>
                    </div>

            </template>

                                <span x-text="profileForm.name ? profileForm.name.charAt(0).toUpperCase() : (username ? username.charAt(0).toUpperCase() : 'U')"></span>
                                <template x-if="profileForm.propic">
                                    <img :src="profileForm.propic" class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover propic-fade-in" onload="this.classList.add('loaded')" onerror="this.classList.remove('loaded')">
                                </template>
                            </div>
                            <label class="position-absolute bottom-0 end-0 bg-orange text-white rounded-circle d-flex align-items-center justify-content-center shadow-md cursor-pointer border border-2 border-white hover-scale camera-badge-btn" title="Carica nuova foto">
                                <i class="bi bi-camera-fill fs-6"></i>
                                <input type="file" class="d-none" accept="image/*" @change="uploadProfileImage">
                            </label>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold small text-uppercase tracking-wider opacity-75">Username</label>
                        <div class="input-group has-validation">
                            <span class="input-group-text border-end-0 fw-bold rounded-start-3" :class="darkMode ? 'bg-secondary bg-opacity-25 text-white border-secondary border-opacity-50' : 'bg-light text-secondary'">@</span>
                            <input type="text" class="form-control rounded-end-3"
                                   x-model="profileForm.name" @input="profileForm.nameError = validateUsername(profileForm.name)"
                                   :class="[profileForm.nameError ? 'is-invalid border-danger' : '', darkMode ? 'bg-dark text-white border-secondary border-opacity-50' : '']"
                                   placeholder="tuo_username">
                            <template x-if="profileForm.nameError">
                                <div class="invalid-feedback d-flex align-items-center gap-1 mt-1 text-danger fw-medium">
                                    <i class="bi bi-exclamation-circle-fill fs-6"></i> <span x-text="profileForm.nameError"></span>
                                </div>
                            </template>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-uppercase tracking-wider opacity-75">URL Immagine Profilo</label>
                        <div class="input-group">
                            <input type="text" class="form-control rounded-start-3" :class="darkMode ? 'bg-dark text-white border-secondary border-opacity-50' : ''" x-model="profileForm.propic" placeholder="https://... o data:image/...">
                            <label class="btn btn-outline-secondary rounded-end-3 mb-0 d-flex align-items-center gap-1.5 fw-bold">
                                <i class="bi bi-upload"></i> Carica
                                <input type="file" class="d-none" accept="image/*" @change="uploadProfileImage">
                            </label>
                        </div>
                    </div>
                    <div class="mb-2">
                        <label class="form-label fw-bold small text-uppercase tracking-wider opacity-75 d-flex align-items-center gap-1.5">
                            <i class="bi bi-sliders text-orange"></i> Livello di Testo Preferito
                        </label>
                        <select class="form-select rounded-3 py-2.5 fw-medium" :class="darkMode ? 'bg-dark text-white border-secondary border-opacity-50' : 'bg-white text-dark'" x-model="profileForm.preferredLevel">
                            <option value="infantile">Infantile (Semplificato per bambini)</option>
                            <option value="semplice">Semplice (Linguaggio intuitivo)</option>
                            <option value="medio">Medio (Standard bilanciato)</option>
                            <option value="dettagliato">Dettagliato (Approfondito completo)</option>

                        </select>
                        <div class="form-text small opacity-75 mt-1.5">
                            Impostato come default automatico per tutte le visite guidate e la riproduzione audio.
                        </div>
                    </div>
                </div>
                <div class="modal-footer border-0 p-4 pt-0 d-flex gap-2">
                    <button type="button" class="btn btn-secondary rounded-pill px-4 py-2 fw-bold" @click="isProfileModalOpen = false">Annulla</button>
                    <button type="button" class="btn btn-orange text-white rounded-pill px-4.5 py-2 fw-bold shadow-sm active-scale" @click="updateProfile()">Salva Modifiche</button>
                </div>
            </div>
        </div>
    </div>
    <!-- CART FLOATING ACTION BUTTON (FAB) -->
    <button class="cart-fab"
        x-show="!isCartOpen"
        @cart-opened.window="isCartOpen = true"
        @cart-closed.window="isCartOpen = false"
        @click="if(isLoggedIn) { var offcanvas = new bootstrap.Offcanvas(document.getElementById('cartOffcanvas')); offcanvas.show(); } else { showToast('Devi essere loggato per poter acquistare! Vai su Sign in', 'error'); }">
        <i class="bi bi-cart3 fs-3"></i>
        <span class="badge bg-danger rounded-pill"
            x-show="cartCount > 0" x-text="cartCount" x-cloak></span>
    </button>

</body>

</html>
