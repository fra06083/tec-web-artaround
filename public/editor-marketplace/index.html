<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Museum Marketplace - ArtAround</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" href="/css/styles.css" />

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="/js/editor/index.js"></script>

</head>

<body class="bg-dark text-white font-sans" data-bs-theme="dark" x-data="marketplaceApp()">

    <div x-show="!isReady">
        <div class="vh-100 d-flex flex-column align-items-center justify-content-center text-center px-4">
            <div class="spinner-border text-orange spinner-lg mb-4" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
            <h3 class="fw-bold">Loading Marketplace...</h3>
        </div>
    </div>

    <div x-show="isReady" x-cloak class="d-flex flex-column min-vh-100">

        <header class="navbar navbar-expand bg-dark border-bottom border-secondary sticky-top py-3 px-4">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold text-white fs-4 d-flex align-items-center gap-2" href="../index.html">
                    <i class="bi bi-box text-orange"></i> ArtAround
                </a>

                <div class="ms-auto d-flex align-items-center gap-3">
                    <div class="input-group d-none d-lg-flex w-auto">
                        <span class="input-group-text bg-secondary border-0 text-white-50 ps-3">
                            <i class="bi bi-search"></i>
                        </span>
                        <input type="text" class="form-control bg-secondary border-0 text-white shadow-none"
                            placeholder="Cerca visite o musei..." x-model="searchQuery">
                    </div>

                    <template x-if="isLoggedIn && permissions === 'admin'">
                        <a href="/editor/dashboard" class="btn btn-outline-light d-flex align-items-center gap-2">
                            <i class="bi bi-pencil-square text-orange"></i>
                            <span class="d-none d-md-inline">Gestisci Visite</span>
                        </a>
                    </template>

                    <div class="d-flex align-items-center gap-2 border-start border-secondary ps-3 ms-1"
                        x-show="isLoggedIn">
                        <span class="d-none d-md-block text-white-50 small me-2" x-text="username"></span>
                        <button class="btn bg-slate rounded-circle d-flex align-items-center justify-content-center">
                            <i class="bi bi-cart"></i>
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <main class="flex-grow-1 p-4 p-lg-5">

            <div class="mb-5 text-center text-md-start">
                <h1 class="fw-bold mb-2">Esplora le Visite</h1>
                <p class="text-white-50 lead">Acquista i pacchetti per i migliori musei ed esposizioni.</p>
            </div>

            <div class="row g-4">
                <template x-for="tour in items" :key="tour._id">
                    <div class="col-12 col-md-6 col-lg-4 col-xl-3">
                        <div class="card bg-secondary bg-opacity-10 border-0 rounded-4 overflow-hidden shadow-sm h-100 d-flex flex-column">
                            <div class="ratio ratio-16x9 position-relative overflow-hidden bg-slate">
                                <div class="position-absolute top-0 start-0 w-100 h-100 bg-dark bg-opacity-25"></div>
                                <span class="badge bg-dark bg-opacity-75 text-white position-absolute top-0 start-0">
                                    Tour Guidato
                                </span>
                            </div>

                            <div class="card-body p-4 d-flex flex-column">
                                <h5 class="fw-bold mb-1" x-text="tour.name"></h5>

                                <p class="text-white-50 small mb-3">
                                    <i class="bi bi-geo-alt-fill text-orange"></i>
                                    <span x-text="tour.museum_id.museum + ' (' + tour.museum_id.provence + ')'"></span>
                                </p>

                                <!-- flex-grow-1 + line-clamp fissano l'altezza della descrizione -->
                                <p class="text-white-50 small flex-grow-1 mb-0" x-text="tour.description">
                                </p>

                                <div class="d-flex justify-content-between align-items-center mt-3 pt-3 border-top border-secondary border-opacity-25">
                                    <span class="text-white-50 small">
                                        <i class="bi bi-collection"></i>
                                        <span x-text="tour.items.length + ' opere'"></span>
                                    </span>
                                    <button class="btn btn-orange rounded-pill px-4 fw-bold">Seleziona</button>
                                </div>
                            </div>
                        </div>
                    </div>
                </template>
            </div>

        </main>
    </div>

</body>

</html>
