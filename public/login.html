<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accedi / Registrati - ArtAround</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />

    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/effects.css" />
    <link rel="stylesheet" href="css/forms.css" />

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>

<body class="login-page d-flex align-items-center justify-content-center vh-100 font-sans">



    <!-- Floating shapes background -->
    <div class="login-shapes">
        <div class="login-shape"></div>
        <div class="login-shape"></div>
        <div class="login-shape"></div>
    </div>

    <div x-data="authApp()"
        class="card login-card border-0 shadow-sm rounded-4 p-4 p-md-5 overflow-hidden position-relative w-100 max-w-450">

        <div class="position-relative z-1">

            <div class="text-center mb-4">
                <a class="text-decoration-none fw-bold text-primary fs-3 d-flex align-items-center justify-content-center gap-2"
                    href="index.html">
                    <i class="bi bi-box"></i> ArtAround
                </a>
                <p class="lead text-secondary mt-2 mb-0 text-11"
                    x-text="isLogin ? 'Bentornato! Effettua l\'accesso.' : 'Crea un nuovo account'"></p>
            </div>

            <template x-if="errorMessage">
                <div class="alert alert-danger border-0 rounded-3 shadow-sm py-2" x-text="errorMessage"></div>
            </template>
            <template x-if="successMessage">
                <div class="alert alert-success border-0 rounded-3 shadow-sm py-2" x-text="successMessage"></div>
            </template>

            <form @submit.prevent="submitForm">

                <div class="mb-3">
                    <label class="form-label fw-bold">Nome Utente</label>
                    <input type="text" x-model="name"
                        class="form-control form-control-lg rounded-pill px-4 shadow-sm login-input"
                        placeholder="es. visitatore1" required>
                </div>

                <div class="mb-4">
                    <label class="form-label fw-bold">Password</label>
                    <input type="password" x-model="password"
                        class="form-control form-control-lg rounded-pill px-4 shadow-sm login-input" placeholder="********"
                        required>
                </div>

                <button type="submit"
                    class="btn btn-orange btn-lg rounded-pill px-4 fw-bold shadow-sm w-100 btn-reveal-icon login-btn"
                    :disabled="isLoading">
                    <span x-show="!isLoading" x-text="isLogin ? 'Accedi' : 'Registrati'"></span>
                    <i class="bi bi-arrow-right reveal-icon" x-show="!isLoading"></i>
                    <span x-cloak x-show="isLoading">Attendi...</span>
                </button>
            </form>

            <div class="text-center mt-4">
                <p class="text-secondary small mb-2">
                    <span x-text="isLogin ? 'Non sei ancora registrato?' : 'Sei già registrato?'"></span>
                    <button type="button" @click="toggleView"
                        class="btn btn-link p-0 text-primary fw-bold text-decoration-none ms-1 hover-bg-light px-2 rounded">
                        <span x-text="isLogin ? 'Clicca qui' : 'Accedi ora'"></span>
                    </button>
                </p>
                <a href="index.html"
                    class="text-secondary text-decoration-none small hover-bg-light px-3 py-2 rounded-pill d-inline-block mt-2">
                    <i class="bi bi-arrow-left"></i> Torna alla Home
                </a>
            </div>

        </div>
    </div>

    <script>
        function authApp() {
            return {
                isLogin: true,
                name: '',
                password: '',
                isLoading: false,
                errorMessage: '',
                successMessage: '',

                toggleView() {
                    this.isLogin = !this.isLogin;
                    this.errorMessage = '';
                    this.successMessage = '';
                    this.password = '';
                },

                async submitForm() {
                    if (this.isLogin) {
                        await this.login();
                    } else {
                        await this.register();
                    }
                },

                // parse response for common errors
                async parseResponse(response) {
                    const text = await response.text();
                    try {
                        return JSON.parse(text)
                    } catch (e) {
                        console.error("Risposta non valida dal server:", text);
                        throw new Error("Errore del server. Riprova più tardi.");
                    }
                },

                async login() {
                    this.isLoading = true;
                    this.errorMessage = '';
                    this.successMessage = '';

                    try {
                        const response = await fetch('/api/login', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({name: this.name, password: this.password})
                        });

                        const data = await this.parseResponse(response);

                        if (!response.ok) throw new Error(data.error || 'Credenziali non valide');

                        // Salva il JWT e l'username per mantenere la sessione
                        localStorage.setItem('artaround_token', data.token);
                        localStorage.setItem('artaround_user', this.name);
                        if (data.user) {
                            localStorage.setItem('artaround_user_data', JSON.stringify(data.user));
                        }

                        // Rimanda alla homepage
                        const params = new URLSearchParams(window.location.search);
                        window.location.href = params.get('redirect') || '/index.html';

                    } catch (error) {
                        this.errorMessage = error.message;
                    } finally {
                        this.isLoading = false;
                    }
                },

                async register() {
                    this.isLoading = true;
                    this.errorMessage = '';
                    this.successMessage = '';

                    try {
                        const response = await fetch('/api/register', {
                            method: 'POST',
                            headers: {'Content-Type': 'application/json'},
                            body: JSON.stringify({
                                name: this.name,
                                password: this.password
                            })
                        });

                        const data = await this.parseResponse(response);

                        if (!response.ok) throw new Error(data.error || 'Errore durante la registrazione');

                        this.successMessage = 'Account creato con successo! Ora puoi accedere.';

                        // Resetta e torna alla vista di login
                        this.isLogin = true;
                        this.password = '';

                    } catch (error) {
                        this.errorMessage = error.message;
                    } finally {
                        this.isLoading = false;
                    }
                }
            }
        }
    </script>
</body>

</html>
