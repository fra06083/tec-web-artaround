name: Deploy Automatico su Rosina

on:
  push:
    branches:
      - main  # Si attiva ogni volta che pushi su main, inutile farlo per roba di test....

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connessione SSH e aggiornamento
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: rosina.cs.unibo.it
          username: francesco.biglieri
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/web/site252632/html/
            git fetch origin main
            git reset --hard origin/main
            cd /home/web/site252632/html/public/navigator/
            /usr/local/node/node-20/bin/npm run build
