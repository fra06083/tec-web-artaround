<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Visite - ArtAround</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <link rel="stylesheet" href="/css/mobile-nav.css">
    <link rel="stylesheet" href="/css/forms.css">
    <link rel="stylesheet" href="/css/toasts.css">
    <link rel="stylesheet" href="/css/effects.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="/js/editor/tours.js"></script>
</head>

<body class="bg-dark text-white font-sans" data-bs-theme="dark" x-data="toursManager()" x-cloak>

    <div x-show="!isReady">
        <div class="vh-100 d-flex flex-column align-items-center justify-content-center text-center">
            <div class="spinner-border text-orange spinner-lg mb-4" role="status"></div>
            <h3 class="fw-bold">Caricamento in corso...</h3>
        </div>
    </div>

    <div x-show="isReady" class="d-flex">
        <aside class="sidebar bg-dark shadow d-flex flex-column">
            <div class="p-4 mb-2">
                <a class="navbar-brand fw-bold text-white fs-4 d-flex align-items-center gap-2"
                    href="/editor-marketplace/index.html">
                    <i class="bi bi-box text-orange"></i>
                    <span class="d-none d-lg-inline">ArtAround</span>
                </a>
            </div>

            <nav class="nav flex-column gap-1 px-3 flex-grow-1">
                <a href="/editor/dashboard" class="nav-link-admin">
                    <i class="bi bi-grid-fill"></i> <span>Dashboard</span>
                </a>
                <a href="/editor/tours" class="nav-link-admin active">
                    <i class="bi bi-pencil-square"></i> <span>Gestione Visite</span>
                </a>

                <div class="nav-section-header mt-4 mb-2">
                    <span class="text-uppercase small fw-bold text-white-50 opacity-50 px-2">Catalogo Artistico</span>
                    <div class="flex-grow-1 border-top border-secondary opacity-25 ms-2"></div>
                </div>

                <a href="/editor/museum" class="nav-link-admin">
                    <i class="bi bi-bank"></i> <span>Gestione Musei</span>
                </a>
                <a href="/editor/artworks" class="nav-link-admin">
                    <i class="bi bi-palette"></i> <span>Gestione Opere</span>
                </a>

                <div class="nav-section-header mt-4 mb-2">
                    <span class="text-uppercase small fw-bold text-white-50 opacity-50 px-2">Sistema</span>
                    <div class="flex-grow-1 border-top border-secondary opacity-25 ms-2"></div>
                </div>

                <a href="/editor/user-management" class="nav-link-admin">
                    <i class="bi bi-people"></i> <span>Gestione Utenti</span>
                </a>
            </nav>

            <div class="p-3 mt-auto">
                <a href="#" @click.prevent="logout()" class="nav-link-admin text-danger w-100 rounded-3">
                    <i class="bi bi-box-arrow-right"></i> <span>Logout</span>
                </a>
            </div>
        </aside>
        <main class="main-content flex-grow-1">
            <!-- Mobile Header -->
            <header class="mobile-header">
                <a href="/editor-marketplace/index.html" class="mobile-logo">
                    <i class="bi bi-box"></i>
                    <span>ArtAround</span>
                </a>
            </header>

            <!-- Desktop Header -->
            <header class="navbar navbar-expand bg-dark border-bottom border-secondary sticky-top py-3 px-4 d-none d-md-flex desktop-navbar">
                <div class="container-fluid">
                    <div class="d-flex align-items-center gap-3">
                        <div class="user-avatar bg-orange rounded-circle d-flex align-items-center justify-content-center glow-orange">
                            <i class="bi bi-person-fill fs-5"></i>
                        </div>
                        <div>
                            <p class="m-0 small text-white-50">Benvenuto</p>
                            <h5 class="m-0 fw-bold gradient-text" x-text="username"></h5>
                        </div>
                    </div>

                    <div class="ms-auto d-flex align-items-center gap-3">
                        <span class="small text-white-50">Admin: <strong class="text-orange"
                                x-text="username"></strong></span>
                    </div>
                </div>
            </header>

            <div class="p-4 p-lg-5">

                <div x-show="step === 'choice'" class="row g-4 justify-content-center py-5">
                    <div class="col-12 text-center mb-4">
                        <h2 class="fw-bold">Cosa vuoi fare oggi?</h2>
                        <p class="text-white-50">Seleziona un'operazione per iniziare la gestione dei contenuti.</p>
                    </div>
                    <div class="col-md-5 col-lg-4">
                        <button @click="setMode('create')"
                            class="card bg-secondary bg-opacity-10 border-secondary border-opacity-25 p-5 rounded-4 text-center w-100 h-100 transition-all hover-bg-light border-0 shadow-sm">
                            <i class="bi bi-plus-circle-dotted text-orange icon-5xl mb-3"></i>
                            <h4 class="fw-bold text-white">Nuova Visita</h4>
                            <p class="text-white-50 small mb-0">Crea una visita da zero!</p>
                        </button>
                    </div>
                    <div class="col-md-5 col-lg-4">
                        <button @click="setMode('edit')"
                            class="card bg-secondary bg-opacity-10 border-secondary border-opacity-25 p-5 rounded-4 text-center w-100 h-100 transition-all hover-bg-light border-0 shadow-sm">
                            <i class="bi bi-pencil-square text-orange icon-5xl mb-3"></i>
                            <h4 class="fw-bold text-white">Modifica Visita</h4>
                            <p class="text-white-50 small mb-0">Aggiorna una visita già esistente!</p>
                        </button>
                    </div>
                </div>

                <div x-show="step === 'selection'" class="max-w-550 mx-auto">
                    <div class="card bg-secondary bg-opacity-10 border-0 rounded-4 p-4 shadow-sm">
                        <div class="d-flex align-items-center gap-3 mb-4">
                            <button @click="step = 'choice'"
                                class="btn btn-sm btn-outline-orange rounded-circle d-flex">
                                <i class="bi bi-arrow-left"></i>
                            </button>
                            <h4 class="fw-bold m-0"
                                x-text="mode === 'create' ? 'Configura Nuova Visita' : 'Seleziona Visita'"></h4>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-bold text-white-50">1. Scegli il Museo di
                                riferimento</label>
                            <select class="form-select bg-slate border-0 text-white p-3" x-model="selectedMuseum"
                                @change="onMuseumChange()">
                                <option value="">Seleziona un museo...</option>
                                <template x-for="m in museums" :key="m._id">
                                    <option :value="m._id" x-text="m.museum"></option>
                                </template>
                            </select>
                        </div>

                        <div x-show="mode === 'edit' && selectedMuseum" class="mb-4">
                            <label class="form-label small fw-bold text-white-50">2. Seleziona il Tour da
                                modificare</label>
                            <select class="form-select bg-slate border-0 text-white p-3" x-model="selectedTourId">
                                <option value="">Scegli il tour...</option>
                                <template x-for="t in availableTours" :key="t._id">
                                    <option :value="t._id" x-text="t.name"></option>
                                </template>
                            </select>
                        </div>

                        <button @click="goToForm()"
                            class="btn bg-orange w-100 py-3 rounded-pill fw-bold mt-2 btn-with-icon"
                            :disabled="!canProceed">
                            Procedi all'Editor <i class="bi bi-chevron-right"></i>
                        </button>
                    </div>
                </div>

                <div x-show="step === 'form'" class="card bg-secondary bg-opacity-10 border-0 rounded-4 p-4 shadow-sm">
                    <div
                        class="d-flex justify-content-between align-items-center mb-4 pb-3 border-bottom border-secondary border-opacity-25">
                        <h4 class="fw-bold m-0 text-orange" x-text="tour.name || 'Nuova Visita'"></h4>
                        <button @click="step = 'selection'"
                            class="btn btn-sm btn-outline-secondary rounded-pill">Indietro</button>
                    </div>

                    <form @submit.prevent="saveTour()">
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label small fw-bold text-white-50">Titolo Visita</label>
                                <input type="text" class="form-control bg-dark border-secondary text-white p-3"
                                    x-model="tour.name">
                            </div>
                        </div>
                        <button type="submit" class="btn bg-orange mt-4 rounded-pill px-5">Salva Tutto</button>
                    </form>
                </div>

            </div>
        </main>
    </div>

    <!-- Mobile Navigation -->
    <nav class="mobile-nav">
        <a href="/editor/dashboard" class="mobile-nav-item">
            <i class="bi bi-grid-fill"></i>
            <span>Dashboard</span>
        </a>
        <a href="/editor/museum" class="mobile-nav-item">
            <i class="bi bi-bank"></i>
            <span>Musei</span>
        </a>
        <a href="/editor/artworks" class="mobile-nav-item">
            <i class="bi bi-palette"></i>
            <span>Opere</span>
        </a>
        <a href="/editor/tours" class="mobile-nav-item active">
            <i class="bi bi-pencil-square"></i>
            <span>Visite</span>
        </a>
        <a href="/editor/user-management" class="mobile-nav-item">
            <i class="bi bi-people"></i>
            <span>Utenti</span>
        </a>
    </nav>
</body>

</html>
