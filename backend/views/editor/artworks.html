<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Opere - ArtAround</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/styles.css">
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="/js/editor/artworks.js"></script>
</head>

<body class="bg-dark text-white font-sans" data-bs-theme="dark" x-data="artworkManager()" x-init="init()">

    <div x-show="!isReady">
        <div class="vh-100 d-flex flex-column align-items-center justify-content-center text-center">
            <div class="spinner-border text-orange spinner-lg mb-4" role="status"></div>
            <h3 class="fw-bold">Accesso in corso...</h3>
        </div>
    </div>

    <div x-show="isReady && isLoggedIn" x-cloak class="d-flex">


        <aside class="sidebar bg-dark shadow d-flex flex-column">
            <div class="p-4 mb-2">
                <a class="navbar-brand fw-bold text-white fs-4 d-flex align-items-center gap-2"
                    href="/editor-marketplace/index.html">
                    <i class="bi bi-box text-orange"></i>
                    <span class="d-none d-lg-inline">ArtAround</span>
                </a>
            </div>

            <nav class="nav flex-column gap-1 px-3 flex-grow-1">
                <a href="/editor/dashboard" class="nav-link-admin">
                    <i class="bi bi-grid-fill"></i> <span>Dashboard</span>
                </a>
                <a href="/editor/tours" class="nav-link-admin">
                    <i class="bi bi-pencil-square"></i> <span>Gestione Visite</span>
                </a>

                <div class="nav-section-header mt-4 mb-2">
                    <span class="text-uppercase small fw-bold text-white-50 opacity-50 px-2">Catalogo Artistico</span>
                    <div class="flex-grow-1 border-top border-secondary opacity-25 ms-2"></div>
                </div>

                <a href="/editor/museum" class="nav-link-admin">
                    <i class="bi bi-bank"></i> <span>Gestione Musei</span>
                </a>
                <a href="/editor/artworks" class="nav-link-admin active">
                    <i class="bi bi-palette"></i> <span>Gestione Opere</span>
                </a>

                <div class="nav-section-header mt-4 mb-2">
                    <span class="text-uppercase small fw-bold text-white-50 opacity-50 px-2">Sistema</span>
                    <div class="flex-grow-1 border-top border-secondary opacity-25 ms-2"></div>
                </div>

                <a href="#" class="nav-link-admin">
                    <i class="bi bi-people"></i> <span>Gestione Utenti</span>
                </a>
                <a href="#" class="nav-link-admin">
                    <i class="bi bi-bar-chart"></i> <span>Statistiche</span>
                </a>
            </nav>

            <div class="p-3 mt-auto">
                <a href="#" @click.prevent="logout()" class="nav-link-admin text-danger w-100 rounded-3">
                    <i class="bi bi-box-arrow-right"></i> <span>Logout</span>
                </a>
            </div>
        </aside>
        <main class="main-content flex-grow-1">
            <header class="navbar bg-dark border-bottom border-secondary py-3 px-4 sticky-top">
                <h5 class="m-0 fw-bold">Gestione Opere</h5>
                <button x-show="step === 'artwork-list'" @click="openArtworkForm()"
                    class="btn btn-orange rounded-pill btn-sm px-3">
                    <i class="bi bi-plus-lg me-1"></i> Nuova Opera
                </button>
            </header>

            <div class="p-4 p-lg-5">

                <div x-show="step === 'artwork-museum-select'" class="max-w-550 mx-auto text-center py-5">
                    <i class="bi bi-search text-orange icon-5xl mb-4 d-block"></i>
                    <h3 class="fw-bold">Gestione Catalogo</h3>
                    <p class="text-white-50 mb-4">Seleziona un museo per visualizzare le sue opere.</p>
                    <select class="form-select form-select-lg bg-dark text-white border-secondary"
                        x-model="selectedMuseumId" @change="fetchArtworks()">
                        <option value="">Scegli un museo...</option>
                        <template x-for="m in museums" :key="m._id">
                            <option :value="m._id" x-text="m.museum"></option>
                        </template>
                    </select>
                </div>

                <div x-show="step === 'artwork-list'">
                    <div class="d-flex align-items-center gap-3 mb-4">
                        <button @click="step = 'artwork-museum-select'"
                            class="btn btn-outline-secondary btn-sm rounded-pill px-3">
                            <i class="bi bi-arrow-left"></i> Cambia Museo
                        </button>
                        <span class="text-white-50 small">Opere di: <strong class="text-white"
                                x-text="getMuseumName(selectedMuseumId)"></strong></span>
                    </div>

                    <div class="card bg-secondary bg-opacity-10 border-0 rounded-4 shadow-lg overflow-hidden">
                        <div class="table-responsive">
                            <table class="table table-dark table-hover align-middle m-0">
                                <thead class="thead-custom">
                                    <tr>
                                        <th class="ps-4 py-3 fw-bold text-uppercase">Opera</th>
                                        <th class="py-3 fw-bold text-uppercase">Artista</th>
                                        <th class="py-3 fw-bold text-uppercase">ID Catalogo</th>
                                        <th class="text-end pe-4 py-3 fw-bold text-uppercase">Azioni</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    <template x-for="art in artworks" :key="art._id">
                                        <tr class="table-row-custom">
                                            <td class="ps-4 py-3">
                                                <div class="d-flex align-items-center gap-3">
                                                    <img :src="art.image || 'https://via.placeholder.com/50'"
                                                        class="rounded-3 img-thumbnail-custom shadow-sm">
                                                    <span class="fw-bold text-white" x-text="art.title"></span>
                                                </div>
                                            </td>
                                            <td class="py-3">
                                                <span class="text-orange fw-medium"
                                                    x-text="art.artist || 'Artista Ignoto'"></span>
                                            </td>
                                            <td class="py-3">
                                                <code class="text-white-50 small" x-text="art._id"></code>
                                            </td>
                                            <td class="text-end pe-4 py-3">
                                                <div class="btn-group rounded-3 overflow-hidden shadow-sm">
                                                    <button @click="openArtworkForm(art)"
                                                        class="btn btn-action bg-slate"><i
                                                            class="bi bi-pencil-square"></i></button>
                                                    <button @click="deleteArtwork(art._id)"
                                                        class="btn btn-action btn-outline-danger border-0 border-start border-secondary border-opacity-25"><i
                                                            class="bi bi-trash3-fill"></i></button>
                                                </div>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div x-show="step === 'artwork-form'" class="max-w-550 mx-auto">
                </div>

            </div>
        </main>
    </div>
</body>

</html>
