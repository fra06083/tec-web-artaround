<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Utenti e Permessi - ArtAround</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="/css/base.css">
    <link rel="stylesheet" href="/css/sidebar.css">
    <link rel="stylesheet" href="/css/mobile-nav.css">
    <link rel="stylesheet" href="/css/forms.css">
    <link rel="stylesheet" href="/css/tables.css">
    <link rel="stylesheet" href="/css/toasts.css">
    <link rel="stylesheet" href="/css/effects.css">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="/js/editor/users.js"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>

<body class="bg-dark text-white font-sans" data-bs-theme="dark" x-data="usersManager()" x-cloak>

    <div x-show="isReady" class="d-flex" x-transition.opacity x-cloak>

        <!-- Sidebar -->
        <aside class="sidebar bg-dark shadow d-flex flex-column">
            <div class="p-4 mb-2">
                <a class="navbar-brand fw-bold text-white fs-4 d-flex align-items-center gap-2"
                    href="/editor-marketplace/index.html">
                    <i class="bi bi-gear-fill text-orange"></i>
                    <span class="d-none d-lg-inline">ArtAround</span>
                </a>
            </div>

            <nav class="nav flex-column gap-1 px-3 flex-grow-1">
                <a href="/editor/dashboard" class="nav-link-admin">
                    <i class="bi bi-grid-fill"></i> <span>Dashboard</span>
                </a>
                <a href="/editor/tours" class="nav-link-admin">
                    <i class="bi bi-pencil-square"></i> <span>Gestione Visite</span>
                </a>

                <div x-show="permissions !== 'docente'" class="nav-section-header mt-4 mb-2">
                    <span class="text-uppercase small fw-bold text-white-50 opacity-50 px-2">Catalogo Artistico</span>
                    <div class="flex-grow-1 border-top border-secondary opacity-25 ms-2"></div>
                </div>

                <a href="/editor/museum" x-show="permissions !== 'docente'" class="nav-link-admin">
                    <i class="bi bi-bank"></i> <span>Gestione Musei</span>
                </a>
                <a href="/editor/artworks" x-show="permissions !== 'docente'" class="nav-link-admin">
                    <i class="bi bi-palette"></i> <span>Gestione Opere</span>
                </a>

                <div x-show="permissions === 'admin'" class="nav-section-header mt-4 mb-2">
                    <span class="text-uppercase small fw-bold text-white-50 opacity-50 px-2">Sistema</span>
                    <div class="flex-grow-1 border-top border-secondary opacity-25 ms-2"></div>
                </div>

                <a href="/editor/user-management" x-show="permissions === 'admin'" class="nav-link-admin active">
                    <i class="bi bi-people"></i> <span>Gestione Utenti</span>
                </a>
            </nav>

            <div class="p-3 mt-auto">
                                <button @click.prevent="logout()" class="btn btn-danger w-100 fw-bold text-white border-0 shadow-sm rounded-3 py-2 mt-2">Logout</button>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content flex-grow-1">

            <!-- Mobile Header -->
            <header class="mobile-header">
                <a href="/editor-marketplace/index.html" class="mobile-logo d-flex align-items-center gap-2 text-decoration-none">
                    <div class="bg-orange-subtle text-orange p-2 rounded-3 d-flex align-items-center justify-content-center btn-icon-38">
                        <i class="bi bi-gear-fill fs-5"></i>
                    </div>
                    <span class="fw-bold text-white fs-4 m-0 tracking-tight-sm">ArtAround</span>
                </a>
            </header>


            <!-- Desktop Header -->
            <header class="navbar navbar-expand glass-header sticky-top py-3 px-4 d-none d-md-flex desktop-navbar">
                <div class="container-fluid">
                    <div class="d-flex align-items-center gap-3">
                        <div class="user-avatar position-relative bg-orange rounded-circle d-flex align-items-center justify-content-center avatar-hover-glow cursor-pointer overflow-hidden">
                            <span x-text="username ? username.charAt(0).toUpperCase() : ''" class="text-white fw-bold"></span>
                            <template x-if="propic">
                                <img :src="propic" alt="" class="position-absolute top-0 start-0 w-100 h-100 object-fit-cover" style="opacity: 0; transition: opacity 0.3s;" onload="this.style.opacity='1'" onerror="this.style.opacity='0'">
                            </template>
                        </div>
                        <div>
                            <p class="m-0 x-small text-white-50 text-uppercase fw-bold tracking-wide-1px">Bentornato</p>
                            <h5 class="m-0 fw-bold text-white" x-text="username"></h5>
                        </div>
                    </div>

                    <div class="ms-auto d-flex align-items-center gap-3">
                        <div class="text-end me-2">
                            <span class="d-block text-white-50 text-uppercase fw-bold fs-065 tracking-wide-1px">Ruolo</span>
                            <span class="text-orange fw-bold" x-text="permissions"></span>
                        </div>
                    </div>
                </div>
            </header>

            <!-- Page Content -->
            <div class="p-4 p-lg-5">

                <div class="row g-4">

                    <!-- Left Column -->
                    <div class="col-md-4">

                        <div class="card bg-secondary bg-opacity-10 border-0 rounded-4 p-3 mb-4 shadow-sm">
                            <h6 class="text-orange fw-bold mb-3 d-flex align-items-center">
                                <i class="bi bi-bell-fill me-2"></i> Richieste Utenti
                                <span class="badge bg-orange ms-auto" x-text="pendingRequests.length"></span>
                            </h6>
                            <div class="list-group list-group-flush bg-transparent">
                                <template x-for="req in pendingRequests" :key="req._id">
                                    <div class="list-group-item bg-transparent border-secondary border-opacity-25 px-0 py-2">
                                        <div class="small fw-bold" x-text="req.user_name"></div>
                                        <div class="text-white-50 small">Vorrebbe gestire: <span class="text-white" x-text="req.title"></span></div>
                                    </div>
                                </template>
                                <div x-show="pendingRequests.length === 0" class="text-white-50 small py-2">Nessuna richiesta da gestire.</div>
                            </div>
                        </div>

                        <div class="card bg-secondary bg-opacity-10 border-0 rounded-4 p-4 shadow-sm">
                            <h5 class="fw-bold mb-3">Cerca Autore</h5>
                            <div class="input-group mb-3">
                                <input type="text" x-model="search" @input.debounce.300ms="searchUsers()"
                                       class="form-control bg-dark border-secondary text-white shadow-none"
                                       placeholder="Cerca per nome o ID...">
                                <span class="input-group-text bg-dark border-secondary text-white-50">
                                    <i class="bi bi-search"></i>
                                </span>
                            </div>

                            <div class="list-group list-group-flush bg-transparent overflow-auto max-h-400">
                                <template x-for="user in users" :key="user._id">
                                    <button @click="selectUser(user._id)"
                                            class="list-group-item list-group-item-action bg-transparent text-white border-secondary border-opacity-25 py-3 px-2 d-flex justify-content-between align-items-center"
                                            :class="selectedUser && selectedUser._id === user._id ? 'bg-orange bg-opacity-10' : ''">
                                        <div>
                                            <div class="fw-bold" x-text="user.name"></div>
                                            <div class="small text-white-50" x-text="user.permissions"></div>
                                        </div>
                                        <i class="bi bi-chevron-right text-orange"></i>
                                    </button>
                                </template>
                            </div>
                        </div>
                    </div>

                    <!-- Right Column -->
                    <div class="col-md-8">

                        <template x-if="!selectedUser">
                            <div class="h-100 d-flex flex-column align-items-center justify-content-center text-white-50 opacity-50 border border-secondary border-dashed rounded-4 p-5 min-h-400">
                                <i class="bi bi-person-gear display-1 mb-3"></i>
                                <h4 class="fw-bold">Pannello di Controllo</h4>
                                <p>Seleziona un utente dalla lista a sinistra per gestirne i musei assegnati.</p>
                            </div>
                        </template>

                        <template x-if="selectedUser">
                            <div class="card bg-secondary bg-opacity-10 border-0 rounded-4 p-4 shadow-sm">

                                <div class="d-flex justify-content-between align-items-start mb-5 pb-3 border-bottom border-secondary border-opacity-25">
                                    <div>
                                        <div class="d-flex align-items-center gap-3">
                                            <template x-if="!isEditingName">
                                                <h2 class="fw-black m-0 text-white d-flex align-items-center gap-2">
                                                    <span x-text="selectedUser.name"></span>
                                                    <button @click="isEditingName = true; editNameValue = selectedUser.name" class="btn btn-sm btn-link text-white-50 p-0 m-0" title="Modifica Username"><i class="bi bi-pencil-square"></i></button>
                                                </h2>
                                            </template>
                                            <template x-if="isEditingName">
                                                <div class="input-group input-group-sm w-auto">
                                                    <input type="text" class="form-control bg-dark text-white border-orange shadow-none fw-bold fs-5" style="min-width: 200px;" x-model="editNameValue" @keyup.enter="updateUsername()">
                                                    <button class="btn btn-orange text-white" @click="updateUsername()" title="Salva"><i class="bi bi-check-lg"></i></button>
                                                    <button class="btn btn-outline-secondary" @click="isEditingName = false" title="Annulla"><i class="bi bi-x-lg"></i></button>
                                                </div>
                                            </template>
                                        </div>
                                        <div class="d-flex align-items-center gap-2 mt-2 mb-1">
                                            <span class="text-white-50 small fw-bold">RUOLO:</span>
                                            <div class="dropdown">
                                                <button class="btn btn-sm btn-outline-orange d-flex align-items-center gap-2 shadow-sm" type="button" data-bs-toggle="dropdown" aria-expanded="false" :disabled="selectedUser.permissions === 'admin' && username !== 'admin'">
                                                    <i class="bi bi-person-badge"></i>
                                                    <span class="fw-bold text-uppercase" x-text="selectedUser.permissions"></span>
                                                    <i class="bi bi-pencil-square ms-1"></i>
                                                </button>
                                                <ul class="dropdown-menu dropdown-menu-dark shadow">
                                                    <li><button class="dropdown-item fw-bold" @click="selectedUser.permissions = 'visitatore'; updateRole('visitatore')">VISITATORE</button></li>
                                                    <li><button class="dropdown-item fw-bold" @click="selectedUser.permissions = 'docente'; updateRole('docente')">DOCENTE</button></li>
                                                    <li><button class="dropdown-item fw-bold" @click="selectedUser.permissions = 'editor'; updateRole('editor')">EDITOR</button></li>
                                                    <li><button class="dropdown-item fw-bold" @click="selectedUser.permissions = 'admin'; updateRole('admin')">ADMIN</button></li>
                                                </ul>
                                            </div>
                                        </div>
                                        <code class="small text-white-50" x-text="selectedUser._id"></code>
                                    </div>
                                    <div class="text-end">
                                        <span class="badge rounded-pill px-3 py-2"
                                              :class="selectedUser.permissions === 'admin' ? 'bg-danger' : 'bg-orange'">
                                              <i class="bi bi-shield-check me-1"></i> Account Attivo
                                        </span>
                                        <button x-show="selectedUser.permissions !== 'admin' || username === 'admin'" 
                                                @click="deleteUser(selectedUser._id)"
                                                class="btn btn-sm btn-outline-danger border-0 ms-2">
                                            <i class="bi bi-trash3-fill"></i> Elimina Utente
                                        </button>
                                    </div>
                                </div>

                                <div class="mb-5">
                                    <h5 class="fw-bold mb-4 d-flex align-items-center">
                                        <i class="bi bi-bank2 me-2 text-orange"></i> Musei sotto la sua gestione
                                    </h5>

                                    <div class="table-responsive rounded-3 border border-secondary border-opacity-25">
                                        <table class="table table-dark table-hover m-0 align-middle">
                                            <thead class="thead-custom">
                                                <tr>
                                                    <th class="ps-3 py-3">NOME MUSEO</th>
                                                    <th>REGIONE / CITTÀ</th>
                                                    <th class="text-end pe-3">AZIONI</th>
                                                </tr>
                                            </thead>
                                            <tbody>
                                                <template x-for="m in selectedUser.museums" :key="m._id">
                                                    <tr class="table-row-custom">
                                                        <td class="ps-3 py-3 fw-bold text-orange" x-text="m.museum"></td>
                                                        <td>
                                                            <span class="text-white" x-text="m.region"></span>
                                                            <small class="text-white-50 d-block" x-text="m.provence"></small>
                                                        </td>
                                                        <td class="text-end pe-3">
                                                            <button @click="revokePermission(m._id)"
                                                                    class="btn btn-sm btn-outline-danger border-0">
                                                                <i class="bi bi-x-circle-fill me-1"></i> Revoca Accesso
                                                            </button>
                                                        </td>
                                                    </tr>
                                                </template>
                                                <tr x-show="selectedUser.museums && selectedUser.museums.length === 0">
                                                    <td colspan="3" class="text-center py-5 text-white-50">
                                                        L'utente non ha ancora musei assegnati.
                                                    </td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                                <div class="p-4 bg-dark rounded-4 border border-orange border-opacity-25">
                                    <h6 class="fw-bold mb-3 text-orange">
                                        <i class="bi bi-plus-circle-fill me-2"></i> Assegna un nuovo museo
                                    </h6>
                                    <p class="small text-white-50 mb-4">L'utente potrà creare tour e modificare opere solo per il museo selezionato.</p>

                                    <div class="row g-3">
                                        <div class="col-md-8">
                                            <select x-model="selectedMuseumId" class="form-select bg-dark border-secondary text-white p-2 shadow-none">
                                                <option value="">-- Seleziona un museo dalla lista --</option>
                                                <template x-for="m in allMuseums" :key="m._id">
                                                    <option :value="m._id" x-text="m.museum"></option>
                                                </template>
                                            </select>
                                        </div>
                                        <div class="col-md-4">
                                            <button @click="grantPermission()"
                                                    class="btn btn-orange w-100 fw-bold p-2"
                                                    :disabled="!selectedMuseumId">
                                                Conferma Accesso
                                            </button>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </template>

                    </div>
                </div>

            </div>
        </main>
    </div>

    


    

    


    <!-- Mobile Navigation -->
    <nav class="mobile-nav">
        <a href="/editor/dashboard" class="mobile-nav-item">
            <i class="bi bi-grid-fill"></i>
            <span>Dashboard</span>
        </a>
        <a href="/editor/tours" class="mobile-nav-item">
            <i class="bi bi-pencil-square"></i>
            <span>Visite</span>
        </a>
        <a href="/editor/museum" x-show="permissions !== 'docente'" class="mobile-nav-item">
            <i class="bi bi-bank"></i>
            <span>Musei</span>
        </a>
        <a href="/editor/artworks" x-show="permissions !== 'docente'" class="mobile-nav-item">
            <i class="bi bi-palette"></i>
            <span>Opere</span>
        </a>
        <a href="/editor/user-management" x-show="permissions === 'admin'" class="mobile-nav-item active">
            <i class="bi bi-people"></i>
            <span>Utenti</span>
        </a>
    </nav>

</body>
</html>
